<style>
:root {
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root,

  --line: rgba(170, 177, 200, 0.1); --line-2: rgba(170, 177, 200, 0.19);
  --ink: #EFEBE1; --ink-2: #AAB1C8; --ink-3: #8E96B4;

}

  --st-ok: #71E4B6; --st-check: #FCC35D; --st-consent: #D7506E;
  --on-ok: #121315; --on-check: #121315; --on-consent: #121315;
  --scrim: rgba(0, 0, 0, .6); --thin: 300; --status: #121315;
  color-scheme: dark;
}
:root[data-theme="forest"] {
  --bg: #0D1512; --raise: #15201B; --raise-2: #1E2C26;
  --line: rgba(163, 182, 171, 0.1); --line-2: rgba(163, 182, 171, 0.19);
  --ink: #E8EEE9; --ink-2: #A3B6AB; --ink-3: #81978B;
  --sun: #CDB06A; --sun-soft: rgba(205, 176, 106, 0.16); --on-sun: #1C1604;
  --st-ok: #78E4B0; --st-check: #FEC25E; --st-consent: #D7506E;
  --on-ok: #0D1512; --on-check: #0D1512; --on-consent: #0D1512;
  --scrim: rgba(0, 0, 0, .6); --thin: 300; --status: #0D1512;
  color-scheme: dark;
}
:root[data-theme="aubergine"] {
  --bg: #150F1C; --raise: #1F1729; --raise-2: #2A2037;

  --ink: #F0E9F4; --ink-2: #B4A6C1; --ink-3: #9C8FAE;
  --sun: #F29DBF; --sun-soft: rgba(242, 157, 191, 0.16); --on-sun: #2B0A18;
  --st-ok: #71E4B6; --st-check: #FCC35D; --st-consent: #D65076;
  --on-ok: #150F1C; --on-check: #150F1C; --on-consent: #150F1C;
  --scrim: rgba(0, 0, 0, .6); --thin: 300; --status: #150F1C;

}
:root[data-theme="porcelain"] {

  --on-ok: #14100A; --on-check: #14100A; --on-consent: #FFFFFF;

}
:root[data-theme="stone"] {
  --bg: #F2EDE5; --raise: #FCF9F4; --raise-2: #E7E0D4;
  --line: rgba(38, 32, 26, 0.1); --line-2: rgba(38, 32, 26, 0.2);
  --ink: #26201A; --ink-2: #584E44; --ink-3: #66594D;
  --sun: #B04526; --sun-soft: rgba(176, 69, 38, 0.12); --on-sun: #FFFFFF;
  --st-ok: #2A9166; --st-check: #AB7707; --st-consent: #A31B41;
  --on-ok: #14100A; --on-check: #14100A; --on-consent: #FFFFFF;
  --scrim: rgba(18, 22, 30, .42); --thin: 400; --status: #15181E;

}

  --ink: #1B241C; --ink-2: #495749; --ink-3: #566656;
  --sun: #2D6A3C; --sun-soft: rgba(45, 106, 60, 0.12); --on-sun: #FFFFFF;
  --st-ok: #339466; --st-check: #AC790B; --st-consent: #A31B41;
  --on-ok: #14100A; --on-check: #14100A; --on-consent: #FFFFFF;

  --bg: #EDF1F7; --raise: #FBFCFE; --raise-2: #DFE6F0;
  --line: rgba(20, 26, 42, 0.1); --line-2: rgba(20, 26, 42, 0.2);
  --ink: #141A2A; --ink-2: #445068; --ink-3: #54617C;
  --sun: #3D4DC0; --sun-soft: rgba(61, 77, 192, 0.12); --on-sun: #FFFFFF;
  --st-ok: #25956F; --st-check: #AF7911; --st-consent: #A31B45;
  --on-ok: #14100A; --on-check: #14100A; --on-consent: #FFFFFF;
  --scrim: rgba(18, 22, 30, .42); --thin: 400; --status: #15181E;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height: 100vh;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 34rem; margin: 0 auto; padding: 0 20px 48px; position: relative; }

/* Header: stays put while the page scrolls */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); transition: box-shadow .2s; }
@supports (backdrop-filter: blur(1px)) and (background: color-mix(in srgb, red, blue)) {
  .top { background: color-mix(in srgb, var(--bg) 94%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
}
.top.scrolled { box-shadow: 0 1px 0 var(--line-2); }
.top::before { content: ""; display: block; height: env(safe-area-inset-top); background: var(--status); }
.top-in { max-width: 34rem; margin: 0 auto; padding: 0 20px 6px; }
header { display: grid; grid-template-columns: 1fr auto; align-items: start; padding: 18px 0 6px; }
.brand { display: flex; align-items: flex-start; gap: 2px; min-width: 0; }
.back { margin: -10px 0 0 -12px; flex: none; }
.mark { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.where { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where:empty { display: none; }
.tools { display: flex; gap: 4px; margin: -10px -8px 0 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:active { background: var(--raise); }
.icon-btn svg { width: 22px; height: 22px; }

/* Notices */
.notice { display: flex; gap: 12px; align-items: center; margin: 10px 0 0; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.notice p { margin: 0; flex: 1; }
.notice .link-btn { color: var(--sun); font-weight: 600; white-space: nowrap; text-decoration: none; }
.notice .x { color: var(--ink-3); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.notice .x svg { width: 16px; height: 16px; }

/* Hero */
.hero { padding: 8px 0 22px; }
/* The two bars at the top of each screen: "Can you email them?" and "Who runs their email?" */
.lgroup { margin-top: 20px; max-width: 30em; }
.lgroup-h { margin: 0 0 9px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); letter-spacing: .01em; }
.lbar { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; }
.lbar .seg { flex: 1 1 0; min-width: 4px; display: flex; align-items: center; }
.lbar.email { height: 22px; border-radius: 6px; }
.lbar.email .seg { padding-left: 5px; }
.lbar .seg .logo { width: 13px; height: 13px; }
.seg.corporate { background: var(--st-ok); }
.seg.check { background: var(--st-check); }
.seg.consent { background: var(--st-consent); }
.seg.google { background: var(--prov-g); }
.seg.microsoft { background: var(--prov-m); }
.seg.other { background: var(--prov-o); }
.seg.pending { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px var(--line-2); }
.lgroup .leads { margin-top: 8px; }
.bars-empty { display: grid; gap: 12px; width: min(100%, 300px); margin: 8px auto 22px; }
.bars-empty .lbar .seg { flex-grow: 1; }
:root { --prov-g: var(--raise-2); --prov-m: var(--raise-2); --prov-o: var(--raise); }
@supports (background: color-mix(in srgb, red, blue)) {
  :root { --prov-g: color-mix(in srgb, var(--ink) 24%, var(--raise)); --prov-m: color-mix(in srgb, var(--ink) 15%, var(--raise)); --prov-o: color-mix(in srgb, var(--ink) 7%, var(--raise)); }
}
/* Google and Microsoft tiles */
.logo { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; flex: none; }
.chip .logo { width: 15px; height: 15px; margin-right: 6px; vertical-align: -2px; }
.ex-sub .logo, .tag .logo { width: 13px; height: 13px; margin-right: 4px; vertical-align: -2px; }
.kv .v .logo { margin-right: 6px; }
/* Waiting on Apps Script: a spinner in the button or in the message at the bottom */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 9px; flex: none; }
.btn.busy::after, .menu button.busy::after, .chip.busy::after { content: ''; display: inline-block; width: 13px; height: 13px; margin-left: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
.menu button { position: relative; }
.menu button.busy::after { position: absolute; right: 4px; top: 50%; margin: -7px 0 0; }
@media (prefers-reduced-motion: reduce) { .spinner, .btn.busy::after, .menu button.busy::after, .chip.busy::after { animation-duration: 2s; } }
.title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.title-row > :first-child { flex: 1; min-width: 0; }
.row-icons { display: flex; flex: none; margin: -9px -10px 0 0; }
.ico-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); transition: opacity .12s; }
.ico-btn.main { color: var(--sun); }
.ico-btn:active { opacity: .45; }
.ico-btn svg { width: 24px; height: 24px; }
.sat-name { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -.015em; overflow-wrap: anywhere; }
.when { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.story { margin: 14px 0 0; font-size: 18px; font-weight: var(--thin); line-height: 1.55; letter-spacing: .005em; color: var(--ink); max-width: 30em; }
.facts { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.empty-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.empty-body { margin: 8px 0 0; color: var(--ink-2); max-width: 28em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--raise-2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--sun); color: var(--on-sun); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.link-btn { color: var(--ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.progress { margin: 14px 0 0; }
.bar { height: 6px; border-radius: 3px; background: var(--raise-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 3px; transition: width .4s ease; }
.progress p { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); }

/* Forms */
.field { width: 100%; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); padding: 0 12px; font-size: 16px; }
textarea.field { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
.field::placeholder { color: var(--ink-3); }
.lbl { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); }
.field-row { display: flex; gap: 8px; margin-top: 10px; }
.field-row .field { flex: 1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.search-form { margin: 18px 0 0; }
.search-form .field-row { margin-top: 0; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; background: var(--raise-2); font-size: 14px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
/* Status pills: same colours as the stand plan. Soft tint and ring when off, solid when selected. */
.chip.st { --stc: var(--st-ok); --onc: var(--on-ok); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--stc); }
.chip.st-check { --stc: var(--st-check); --onc: var(--on-check); }
.chip.st-consent { --stc: var(--st-consent); --onc: var(--on-consent); }
@supports (background: color-mix(in srgb, red, blue)) {
  .chip.st { background: color-mix(in srgb, var(--stc) 13%, var(--raise-2)); }
}
.chip.st[aria-pressed="true"] { background: var(--stc); color: var(--onc); box-shadow: none; }
.chip .n { font-size: 12.5px; opacity: .8; }
.filters { margin: 4px 0 0; }
.quiet-search { margin: 12px 0 0; }

/* Lists */
.day { margin: 26px 0 2px; font-size: 14px; font-weight: 500; color: var(--ink-3); }
.section-title { margin: 32px 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.section-note { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-3); }
.item, .ex { border-bottom: 1px solid var(--line); }
.item-main, .ex-main { width: 100%; display: grid; align-items: center; text-align: left; min-width: 0; }
.item-main { grid-template-columns: minmax(0, 1fr) 18px; column-gap: 12px; padding: 14px 0; min-height: 56px; }
.ex-main { grid-template-columns: 12px 1fr 18px; column-gap: 12px; padding: 12px 0; min-height: 60px; }
.item-main > svg, .ex-main > svg { width: 18px; height: 18px; color: var(--ink-3); }
.item-name, .ex-name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-name.long { overflow: visible; text-overflow: clip; white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
.item-main > span { min-width: 0; }
.item-sub, .ex-sub { display: block; font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-sub.dim { color: var(--ink-3); }
.ex-t { min-width: 0; }
.dot { width: 12px; height: 12px; border-radius: 3px; }
.dot.corporate { background: var(--st-ok); }
.dot.check { background: var(--st-check); }
.dot.consent { background: var(--st-consent); }
.dot.pending { border: 1.5px solid var(--ink-3); }
.more-btn { display: block; width: 100%; padding: 14px 0; text-align: left; font-size: 14px; font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.empty-list { margin: 18px 0 0; color: var(--ink-2); }
.foot { margin-top: 36px; font-size: 12.5px; color: var(--ink-3); }

/* Sheets */
dialog.sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 34rem; max-height: 90vh;
  border: 0; border-radius: 22px 22px 0 0; padding: 0; background: var(--raise); color: var(--ink);
  overflow: auto; overscroll-behavior: contain;
}
dialog.sheet[open] { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
dialog.sheet::backdrop { background: var(--scrim, rgba(0, 0, 0, .55)); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-in { padding: 10px 22px calc(28px + env(safe-area-inset-bottom)); }
.grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sheet h3 { margin: 26px 0 6px; font-size: 15px; font-weight: 600; }
.sheet p { margin: 6px 0; color: var(--ink-2); font-size: 15px; }
.sheet p.hint, .sheet .hint { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-3); }
.sheet .small, .small { font-size: 13.5px; color: var(--ink-3); }
.sheet .chips { margin-top: 10px; }
.kv { padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv .k { display: block; font-size: 13px; color: var(--ink-3); }
.kv .v { display: block; font-size: 16px; color: var(--ink); overflow-wrap: anywhere; user-select: text; }
.kv .v a { text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.kv .s { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; }
.menu { margin: 14px 0 0; }
.menu button { display: block; width: 100%; text-align: left; padding: 15px 0; min-height: 52px; border-bottom: 1px solid var(--line); font-weight: 500; font-size: 16px; }
.menu button small { display: block; font-weight: 400; font-size: 13.5px; color: var(--ink-3); margin-top: 1px; }
.menu button:last-child { border-bottom: 0; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 12px; background: var(--raise-2); font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 10px 8px 0 0; }
.tag.corporate { background: var(--sun); color: var(--on-sun); }
/* How many exhibitions a business is in, copying the company number, and the Companies House picker */
.ex-main.has-badge { grid-template-columns: 12px 1fr auto 18px; }
.ex-badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 7px; border-radius: 12px; background: var(--raise-2); color: var(--ink-2); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
.ex-badge svg { width: 14px; height: 14px; }
.leads .pct { color: var(--ink-3); font-size: .86em; margin-left: 2px; font-variant-numeric: tabular-nums; }
.v-copy { display: flex; align-items: center; gap: 2px; }
.copy-btn { width: 40px; height: 40px; margin: -8px 0 -8px 2px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; flex: none; }
.copy-btn:active { background: var(--raise-2); }
.copy-btn svg { width: 19px; height: 19px; }
.copy-btn.done { color: var(--st-ok); }
.kv .s + .v { margin-top: 8px; }
.menu.picks button { padding: 12px 0; }
.menu.picks button.off { opacity: .75; }
.ex-note { font-size: 13.5px; color: var(--ink-3); margin: 4px 0 0; }
/* Notification setup steps */
.steps { list-style: none; counter-reset: st; margin: 14px 0 0; padding: 0; }
.steps li { counter-increment: st; position: relative; padding: 12px 0 14px 40px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink-2); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--raise-2); color: var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.steps li strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.steps .btn { margin-top: 8px; }
.code { display: block; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: text; }
.code { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 14px; word-break: break-all; user-select: all; }
.status-box { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--bg); font-size: 14px; color: var(--ink-2); }
.status-box p { margin: 2px 0; font-size: 14px; }

/* Find shows */
.find { margin: 4px 0 4px; padding: 14px; border-radius: 18px; background: var(--raise); border: 1px solid var(--line); animation: drop .18s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
.combo { position: relative; flex: 1; min-width: 0; }
.combo .field { padding-right: 46px; }
.combo-btn { position: absolute; right: 0; top: 0; width: 46px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 12px; }
.combo-btn svg { width: 20px; height: 20px; transition: transform .18s; }
.combo-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.find-list { margin-top: 10px; max-height: min(46vh, 380px); overflow-y: auto; overscroll-behavior: contain; border-radius: 12px; background: var(--bg); }
.opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 0 14px; text-align: left; font-size: 15.5px; color: var(--ink); border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt:active { background: var(--raise-2); }
.opt .n { flex: none; min-width: 1.5ch; text-align: right; font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.opt.has .n { color: var(--sun); font-weight: 600; }
.opt-note { margin: 0; padding: 14px; font-size: 14px; color: var(--ink-3); }
#searchBtn .i-close, #searchBtn[aria-expanded="true"] .i-open { display: none; }
#searchBtn[aria-expanded="true"] .i-close { display: block; }
#searchBtn[aria-expanded="true"] { color: var(--sun); }
.leads { list-style: none; margin: 14px 0 0; padding: 0; max-width: 30em; font-size: 17px; font-weight: var(--thin); line-height: 1.4; color: var(--ink); }
.leads li { padding: 6px 0; display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.leads .lk { width: 12px; height: 12px; border-radius: 3px; margin-top: 6px; justify-self: center; }
.leads .lk.google, .leads .lk.microsoft { width: 16px; height: 16px; margin-top: 4px; border-radius: 0; }
.leads .lk .logo { display: block; }
.leads .lk.other { background: var(--prov-o); box-shadow: inset 0 0 0 1px var(--line-2); }
.leads .lk.corporate { background: var(--st-ok); }
.leads .lk.check { background: var(--st-check); }
.leads .lk.consent { background: var(--st-consent); }
.leads strong { font-weight: 600; }

/* How matches were made, speed and rechecks, in Settings */
.ev { display: grid; gap: 8px; margin-top: 10px; }
.ev-row { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); }
.ev-row b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.sp-row { margin-top: 10px; }
.why { margin: 10px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--bg); color: var(--ink-2); font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.why-cmp { display: grid; gap: 4px; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.why-cmp b { color: var(--ink); font-weight: 600; }
.sp-row .use-row { margin-bottom: 4px; }
.rc-grid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px 14px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.rc-grid b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.rc-grid .arrow { color: var(--ink-3); }
.rc-grid .lab { display: flex; gap: 10px; align-items: center; }
.rc-grid .head { font-size: 12.5px; color: var(--ink-3); text-align: right; }
/* Colour theme and usage, both in Settings */
.use { margin-top: 12px; }
.use-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; font-size: 14px; color: var(--ink-2); }
.use-row b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 4px; margin-top: 8px; }
.theme-opt { display: grid; justify-items: center; gap: 6px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); }
.theme-opt[aria-pressed="true"] { color: var(--ink); }
.sw { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2);
  background: radial-gradient(circle, var(--b) 0 6px, transparent 7px), radial-gradient(circle at 50% 35%, var(--c), var(--a)); }
.theme-opt[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sun); }

/* Toast. It is a popover, which the browser draws in its top layer, so it shows above an open sheet (a sheet is a modal dialog
   and covers any ordinary element, whatever its z-index). The resets below undo the browser's own popover box. */
.toast { position: fixed; inset: auto auto calc(24px + env(safe-area-inset-bottom)) 50%; margin: 0; border: 0; width: max-content; height: auto; overflow: visible; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 22px; font-size: 14px; font-weight: 500; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px); text-align: center; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.notify-result { margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.notify-result:empty { display: none; }
.notify-result.bad { color: var(--st-consent); font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<div class="top" id="top"><div class="top-in">
  <header>
    <div class="brand">
      <button class="icon-btn back" id="back" type="button" data-act="back" aria-label="Back" hidden>

      </button>

    </div>
    <div class="tools">
      <button class="icon-btn" id="searchBtn" type="button" aria-expanded="false" aria-controls="findPanel" aria-label="Find shows" hidden>
        <svg class="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <svg class="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <div class="find" id="findPanel" hidden>

      <label class="lbl" for="findIn" style="margin-top:0">Find shows for a sector</label>

        <div class="combo">
          <input class="field" id="findIn" placeholder="Type a sector" autocomplete="off" autocapitalize="sentences" enterkeyhint="go" maxlength="40" role="combobox" aria-expanded="false" aria-controls="findList">
          <button class="combo-btn" id="findArrow" type="button" aria-expanded="false" aria-controls="findList" aria-label="Show all sectors">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>

</div></div>
<div class="wrap">

  <main id="main" aria-live="polite"></main>
  <p class="foot" id="foot">A guide only, not legal advice. Emailing a limited company still needs your name, a relevant offer and a way to opt out. Company details come from Companies House. Pages are read politely and only where the site allows it.</p>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" popover="manual"></div>

<script src="core.js?v=14"></script>
<script>
(() => {
'use strict';
const C = window.Core;
const LOAD_FAIL = '<section class="hero"><h1 class="empty-title">Exhibitor Leads could not load</h1><p class="empty-body">Part of the app did not arrive. Close it fully and open it again.</p></section>';
if (!C) { document.getElementById('main').innerHTML = LOAD_FAIL; return; }

/* ---------- Platform ---------- */
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isAndroid = /Android/.test(UA);


/* ---------- Storage ---------- */
const P = 'exl.';
const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };
const drop = (k) => { try { localStorage.removeItem(P + k); } catch {} };

const THEMES = [
  { id: 'harbour', name: 'Harbour', bg: '#0E1426', card: '#161D36', accent: '#F2C063' },
  { id: 'graphite', name: 'Graphite', bg: '#121315', card: '#1B1D20', accent: '#6CAAFF' },
  { id: 'forest', name: 'Forest', bg: '#0D1512', card: '#15201B', accent: '#CDB06A' },
  { id: 'aubergine', name: 'Aubergine', bg: '#150F1C', card: '#1F1729', accent: '#F29DBF' },
  { id: 'porcelain', name: 'Porcelain', bg: '#F5F4EF', card: '#FFFFFF', accent: '#0B6B6B' },
  { id: 'stone', name: 'Stone', bg: '#F2EDE5', card: '#FCF9F4', accent: '#B04526' },
  { id: 'sage', name: 'Sage', bg: '#EEF1EA', card: '#FAFBF8', accent: '#2D6A3C' },
  { id: 'sky', name: 'Sky', bg: '#EDF1F7', card: '#FBFCFE', accent: '#3D4DC0' },
];

const S = {
  api: get('api', null),            // { url, token }
  shows: get('shows', []),
  showsAt: get('showsAt', 0),
  rows: {},                         // showId -> rows
  route: { v: 'home' },
  filter: 'all', q: '', limit: 200,
  set: Object.assign({ theme: 'harbour', lastSector: '' }, get('settings', {})),
  status: get('status', null),
  build: get('build', null),
  usage: null,                      // the last 24 hours, from the sheet. Never saved, so it is never stale
  usageHidden: '',
  offline: false, offlineMsg: '',
  installEvt: null,
  shared: null,
  busy: {},
};
const E = { running: false, stop: false, showId: null, idle: 0 };   // the checking loop
const saveSet = () => put('settings', S.set);

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = C.esc;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const showById = (id) => S.shows.find((s) => s.id === id);
const today = () => C.todayIso();

let toastTimer, toastHide;
/** A message at the bottom that stays, with a spinner, until toast() replaces it with the answer. */
function busyToast(msg) {
  toast(msg);
  clearTimeout(toastTimer); clearTimeout(toastHide);
  $('#toast').innerHTML = '<span class="spinner" aria-hidden="true"></span>' + esc(msg);
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  clearTimeout(toastTimer); clearTimeout(toastHide);
  // Shown as a popover so it sits above an open sheet. Showing it again puts it back on top. An older browser just shows it as before.
  try { if (t.showPopover) { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } } catch (e) { /* no popover support */ }
  void t.offsetWidth;   // so it fades in rather than appearing
  t.classList.add('show');
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    toastHide = setTimeout(() => { try { if (t.matches(':popover-open')) t.hidePopover(); } catch (e) { /* no popover support */ } }, 260);
  }, Math.max(2600, msg.length * 55));
}

const ICON = {
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  stack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3 9l9 5 9-5-9-5Z"/><path d="M3 14l9 5 9-5"/></svg>',
};

/* ---------- Talking to the sheet ---------- */
class ApiError extends Error {}

async function call(action, data, ms) {
  if (!S.api) throw new ApiError('Connect your sheet first');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 60000);
  let j;
  try {
    const r = await fetch(S.api.url, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.api.token }, data || {})), signal: ctl.signal });
    j = await r.json();
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError' ? 'Your sheet took too long to answer' : 'Could not reach your sheet');
    err.net = true;
    throw err;
  } finally { clearTimeout(timer); }
  if (j && j.error) throw new ApiError(j.error === 'Unauthorised' ? 'The token is not right. Check it in Settings.' : j.error);
  return j || {};
}

function setOffline(err) {
  S.offline = !!(err && err.net);
  S.offlineMsg = err ? err.message : '';
  renderNotices();
}

/* ---------- Data ---------- */
function totals() {
  const t = { total: 0, done: 0, corporate: 0, consent: 0, check: 0, google: 0, microsoft: 0, pending: 0 };
  S.shows.forEach((s) => { const c = s.counts || {}; Object.keys(t).forEach((k) => { t[k] += c[k] || 0; }); });
  return t;
}

// The same warning stays hidden once dismissed, even as the percentage creeps up. A change of kind brings it back.
const usageKey = () => (S.usage && S.usage.warn ? S.usage.message.replace(/\d+%/, '') : '');

function setUsage(u) {
  S.usage = C.usage(u);
  renderNotices();
  const box = $('#usageBox');
  if (box && sheet.open) box.outerHTML = usageHtml();
}

// The sheet's own summary of its checks (how matches were made, speed, rechecks). Optional: Settings simply shows what it last had.
// A phone updated before the Apps Script was: the sheet does not know the new action yet.
const oldScript = (e) => (/unknown action/i.test(e.message || '') ? 'Your Apps Script needs its new version first. The README says how (Update).' : e.message);

// The release of Apps Script code this app expects. Shown in Settings; a warning appears when the script behind the app is older.
const EXPECT_BUILD = 14;

async function checkBuild() {
  if (!S.api) return;
  try { const j = await call('ping', null, 20000); S.build = +j.build || 0; put('build', S.build); renderNotices(); } catch (e) { /* offline: keep what we knew */ }
}

async function refreshStatus() {
  if (!S.api) return;
  try { const j = await call('status'); S.status = j; put('status', j); setUsage(j.usage); } catch (e) { /* not needed to carry on */ }
}

async function refreshShows() {
  if (!S.api) return false;
  try {
    const j = await call('list');
    const changed = JSON.stringify(j.shows || []) !== JSON.stringify(S.shows);
    S.shows = j.shows || [];
    setUsage(j.usage);
    S.showsAt = Date.now();
    put('shows', S.shows); put('showsAt', S.showsAt);
    setOffline(null);
    if (changed && (S.route.v === 'home' || S.route.v === 'sector')) renderMain();
    return true;
  } catch (e) { setOffline(e); if (!e.net) toast(e.message); return false; }
}

function cachedRows(id) { return get('rows.' + id, []); }
function saveRows(id) {
  put('rows.' + id, S.rows[id] || []);
  let ids = get('rowIds', []).filter((x) => x !== id);
  ids.unshift(id);
  ids.slice(6).forEach((old) => drop('rows.' + old));
  put('rowIds', ids.slice(0, 6));
}
function syncCounts(id) {
  const s = showById(id);
  if (s && S.rows[id]) { s.counts = C.countRows(S.rows[id]); put('shows', S.shows); }
}
async function fetchRows(id) {
  const j = await call('rows', { showId: id });
  S.rows[id] = j.rows || [];
  saveRows(id); syncCounts(id);
  setOffline(null);
}
function mergeRows(id, changed) {
  if (!changed || !changed.length) return;
  const list = S.rows[id] || (S.rows[id] = []);
  const at = new Map(list.map((r, i) => [r.id, i]));
  changed.forEach((r) => {
    if (at.has(r.id)) {
      const old = list[at.get(r.id)];
      if (old && old.alsoIn && !r.alsoIn) r.alsoIn = old.alsoIn;   // a check or an edit does not say which other exhibitions a business is in
      list[at.get(r.id)] = r;
    } else { at.set(r.id, list.length); list.push(r); }
  });
  saveRows(id); syncCounts(id);
}
const rowById = (id) => { const l = S.rows[S.route.showId] || []; return l.find((r) => r.id === id); };

/* ---------- Checking loop ---------- */
async function runChecks(id) {
  if (E.running) return;
  const show = showById(id);
  if (!show) return;
  Object.assign(E, { running: true, stop: false, showId: id, idle: 0 });
  updateShow();
  try {
    while (!E.stop && S.route.v === 'show' && S.route.showId === id && document.visibilityState === 'visible') {
      const r = await call('enrich', { showId: id, budget: 20 }, 70000);
      mergeRows(id, r.changed);
      if (r.usage) setUsage(r.usage);
      setOffline(null);
      updateShow();
      if (r.pending <= 0) break;
      if (!r.processed) {
        // someone else (the background check) has the rest: look again shortly
        if (++E.idle > 20) break;
        await sleep(8000);
        await fetchRows(id).catch(() => {});
        updateShow();
        if (!(S.rows[id] || []).some((x) => C.statusOf(x) === 'pending')) break;
      } else E.idle = 0;
    }
  } catch (e) {
    setOffline(e);
    if (!e.net) toast(e.message);
  } finally {
    E.running = false;
    updateShow();
  }
}
function ensureChecking() {
  const id = S.route.showId;
  if (S.route.v === 'show' && id && (S.rows[id] || []).some((r) => C.statusOf(r) === 'pending') && !E.running && !E.userPaused) runChecks(id);
}

/* ---------- Routing ---------- */
function go(route, replace) {
  S.route = route;
  S.filter = 'all'; S.q = ''; S.limit = 200;
  if (replace) history.replaceState({ r: route }, ''); else history.pushState({ r: route }, '');
  E.userPaused = false;
  enter();
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', (e) => {
  S.route = (e.state && e.state.r) || { v: 'home' };
  S.filter = 'all'; S.q = ''; S.limit = 200;
  closeSheet(); closeFind();
  enter();
  window.scrollTo(0, 0);   // going back shows the screen from its top, not where it was left
});
async function enter() {
  render();
  const r = S.route;
  if (r.v === 'show') {
    const id = r.showId;
    if (!S.rows[id]) S.rows[id] = cachedRows(id);
    updateShow();
    try { await fetchRows(id); } catch (e) { setOffline(e); if (!e.net) toast(e.message); }
    if (S.route.showId !== id) return;
    updateShow();
    ensureChecking();
  } else if (S.api) refreshShows();
}

/* ---------- Rendering: shell ---------- */
function render() {
  renderHeader();
  renderNotices();
  renderMain();
}

function renderHeader() {
  const r = S.route;
  $('#back').hidden = r.v === 'home';
  $('#searchBtn').hidden = !S.api;
  if (!S.api) closeFind();
  let where = '';
  if (r.v === 'home') where = S.api ? (S.shows.length ? C.plural(S.shows.length, 'exhibition') : 'Ready') : 'Not connected';
  else if (r.v === 'sector') where = 'Sector';
  else { const s = showById(r.showId); where = s ? s.sector : ''; }
  $('#where').textContent = where;
}

function renderNotices() {
  const out = [];
  const dismissed = get('dismissed', {});
  if (S.offline && S.api) out.push(`<div class="notice"><p>${esc(S.offlineMsg || 'Could not reach your sheet')}. Showing what is saved on this phone.</p><button class="link-btn" type="button" data-act="retry">Retry</button></div>`);
  if (S.api && !S.offline && C.scriptOutdated(S.build, EXPECT_BUILD)) {
    out.push(`<div class="notice"><p>Your Apps Script is out of date (${S.build ? 'release ' + esc(S.build) : 'an older release'}, this app needs ${EXPECT_BUILD}). Paste the new Code.gs and deploy a new version, or the newer checks will not run.</p><button class="link-btn" type="button" data-act="settings">Details</button></div>`);
  }
  if (!standalone && !dismissed.install) {
    if (S.installEvt) out.push(`<div class="notice"><p>Add Exhibitor Leads to your home screen for one-tap access.</p><button class="link-btn" type="button" data-act="install">Install</button><button class="x" type="button" data-dismiss="install" aria-label="Dismiss">${ICON.x}</button></div>`);
    else if (isIOS) out.push(`<div class="notice"><p>Add Exhibitor Leads to your Home Screen: tap Share, then Add to Home Screen.</p><button class="x" type="button" data-dismiss="install" aria-label="Dismiss">${ICON.x}</button></div>`);
  }
  if (S.api && !S.offline && S.usage && S.usage.warn && S.usageHidden !== usageKey()) {
    out.push(`<div class="notice"><p>${esc(S.usage.message)}</p><button class="link-btn" type="button" data-act="settings">Details</button><button class="x" type="button" data-act="hide-usage" aria-label="Dismiss">${ICON.x}</button></div>`);
  }
  $('#notices').innerHTML = out.join('');
}

function renderMain() {
  const r = S.route;
  $('#main').innerHTML = r.v === 'sector' ? sectorHtml(r.sector) : r.v === 'show' ? showShellHtml() : homeHtml();
  renderHeader();
  if (r.v === 'show') updateShow();
}

/* ---------- Google and Microsoft tiles, and the two bars ---------- */
const LOGO = {
  google: '<img class="logo" src="google.png" alt="" width="16" height="16" decoding="async">',
  microsoft: '<img class="logo" src="microsoft.png" alt="" width="16" height="16" decoding="async">',
};
const logo = (k) => LOGO[k] || '';
/** Before there is anything to count: two empty bars, as a picture of what will come. */
const barsEmpty = () => '<div class="bars-empty" aria-hidden="true"><div class="lbar"><i class="seg pending"></i></div><div class="lbar email"><i class="seg pending"></i></div></div>';

/* ---------- Home ---------- */
function homeHtml() {
  if (!S.api) {
    return `<section class="hero">${barsEmpty()}
      <h1 class="empty-title">Connect your sheet</h1>
      <p class="empty-body">Exhibitor Leads keeps everything in your own Google Sheet. Add the web app address and token once, and it is ready.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="settings">Connect</button></div></section>`;
  }
  const t = totals(), sectors = C.sectorsFrom(S.shows);
  const has = S.shows.length > 0;
  const head = { n: String(S.shows.length), text: `${S.shows.length === 1 ? 'exhibition' : 'exhibitions'} in ${C.plural(sectors.length, 'sector')}` };
  return `<section class="hero" id="homeHero">${t.total ? '' : barsEmpty()}
      <h1 class="empty-title">${has ? 'Your leads' : 'Who are you selling to?'}</h1>
      ${has ? leadsHtml(head, t, 'No exhibitors loaded yet.') : `<p class="empty-body">Tap the search icon, or the button below, and choose a sector such as baby, whisky or crafts. You get searches to find the shows, then Exhibitor Leads reads each exhibitor list for you.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="open-search">Find shows</button></div>`}
    </section>
    ${sectors.length ? `<h2 class="section-title">Your sectors</h2>${sectors.map(sectorRow).join('')}` : ''}`;
}

/**
 * "Your leads": the counts, then two groups, each a bar with its own lines underneath in the same colours and order:
 * "Can you email them?" and "Who runs their email?". Falls back to a sentence while there is nothing to count.
 */
function leadsHtml(head, c, fallback) {
  const li = (l) => `<li><i class="lk${l.k ? ' ' + l.k : ''}" aria-hidden="true">${logo(l.k)}</i><span>${l.n ? `<strong class="num">${esc(l.n)}</strong>${l.pct ? ` <span class="pct">(${esc(l.pct)})</span>` : ''} ` : ''}${esc(l.text)}</span></li>`;
  const g = C.leadGroups(c);
  if (!g && !head) return `<p class="story">${esc(fallback)}</p>`;
  const total = g ? g.status.bar.reduce((a, x) => a + x.n, 0) : 0;
  const group = (title, kind, grp) => `<div class="lgroup ${kind}"><h3 class="lgroup-h">${title}</h3>
    <div class="lbar ${kind}" role="img" aria-label="${esc(C.barLabel(title.replace(/\?$/, ''), grp.bar))}">${grp.bar.map((x) => `<i class="seg ${x.k}" style="flex-grow:${x.n}">${kind === 'email' && x.n / total >= 0.07 ? logo(x.k) : ''}</i>`).join('')}</div>
    <ul class="leads">${grp.lines.map(li).join('')}</ul></div>`;
  return `<ul class="leads">${head ? li(head) : ''}${g ? li(g.head) : li({ n: '', text: fallback })}</ul>`
    + (g ? group('Can you email them?', 'status', g.status) + (g.email ? group('Who runs their email?', 'email', g.email) : '') : '');
}

function sectorRow(s) {
  const bits = [C.plural(s.shows, 'exhibition')];
  if (s.total) bits.push(C.plural(s.total, 'exhibitor'));
  if (s.corporate) bits.push(`${s.corporate} can email`);
  return `<div class="item"><button class="item-main" type="button" data-sector="${esc(s.name)}"><span><span class="item-name long">${esc(s.name)}</span><span class="item-sub num">${esc(bits.join(', '))}</span></span>${ICON.chev}</button></div>`;
}

/* ---------- Sector ---------- */
function sectorHtml(sector) {
  const shows = S.shows.filter((s) => s.sector === sector);
  const t = { total: 0, done: 0, corporate: 0, consent: 0, check: 0, google: 0, microsoft: 0, pending: 0 };
  shows.forEach((s) => { const c = s.counts || {}; Object.keys(t).forEach((k) => { t[k] += c[k] || 0; }); });
  const links = C.searchLinks(sector);
  const groups = C.groupShows(shows, today());
  return `<section class="hero">${t.total ? '' : barsEmpty()}
      <div class="title-row"><h1 class="sat-name">${esc(sector)}</h1>
        <div class="row-icons">
          <button class="ico-btn main" type="button" data-act="add-show" aria-label="Add exhibition" title="Add exhibition">${ICON.plus}</button>
          ${shows.length ? `<button class="ico-btn" type="button" data-act="rename-sector" aria-label="Rename sector" title="Rename sector">${ICON.pencil}</button>` : ''}
          ${t.total ? `<button class="ico-btn" type="button" data-act="sector-csv" aria-label="Download CSV" title="Download CSV">${ICON.down}</button>` : ''}
        </div></div>
      ${shows.length ? leadsHtml({ n: String(shows.length), text: shows.length === 1 ? 'exhibition' : 'exhibitions' }, t, 'No exhibitors loaded yet.') : '<p class="empty-body">No exhibitions yet. Run one of the searches below, open a show’s exhibitor list, then add it here.</p>'}
    </section>
    <h2 class="section-title" style="margin-top:8px">Find exhibitions</h2>
    <p class="section-note">These open a Google search in a new tab. Find a show’s exhibitor list, then share it to Exhibitor Leads or copy its address.</p>
    <div class="chips" style="margin-top:12px">${links.map((l) => `<a class="chip" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div>
    ${groups.map((g) => `<h2 class="day">${esc(g.label)}</h2>${g.shows.map(showRow).join('')}`).join('')}`;
}

function showRow(s) {
  const c = s.counts || {};
  let sub;
  if (!c.total) sub = s.status === 'loaded' ? 'No exhibitors found' : s.status === 'blocked' || s.status === 'empty' || s.status === 'error' ? 'Needs a pasted list' : 'Not loaded yet';
  else if (c.pending) sub = `Checking ${c.done} of ${c.total}`;
  else sub = `${C.plural(c.total, 'exhibitor')}, ${c.corporate} can email`;
  return `<div class="item"><button class="item-main" type="button" data-show="${esc(s.id)}"><span><span class="item-name long">${esc(s.name)}</span><span class="item-sub num">${esc(C.fmtDates(s.start, s.end))}</span><span class="item-sub num">${esc(sub)}</span></span>${ICON.chev}</button></div>`;
}

/* ---------- Show ---------- */
function showShellHtml() {
  const s = showById(S.route.showId);
  if (!s) return `<section class="hero"><h1 class="empty-title">Exhibition not found</h1><p class="empty-body">It may have been deleted. Go back and choose another.</p></section>`;
  return `<section class="hero" id="showHero"></section>
    <div id="showFilters"></div>
    <div id="showRows"></div>`;
}

function showActions(s, c) {
  const running = E.running && E.showId === s.id;
  if (!c.total) {
    const bad = s.status === 'blocked' || s.status === 'empty' || s.status === 'error';
    if (s.urls.length && !bad) return `<button class="btn primary" type="button" data-act="load">Load exhibitor list</button><button class="btn" type="button" data-act="paste">Paste a list</button>`;
    return `<button class="btn primary" type="button" data-act="paste">Paste the list</button>${!s.urls.length ? '<button class="btn" type="button" data-act="edit-show">Add a link</button>' : s.status === 'blocked' ? '<button class="btn" type="button" data-act="edit-show">Change the link</button>' : '<button class="btn" type="button" data-act="load">Try the link again</button>'}`;
  }
  let out = '';
  if (c.pending) out += running ? '<button class="btn" type="button" data-act="pause">Pause checking</button>' : '<button class="btn primary" type="button" data-act="resume">Keep checking</button>';
  return out;
}

function updateShow() {
  if (S.route.v !== 'show') return;
  const s = showById(S.route.showId), hero = $('#showHero');
  if (!s || !hero) return;
  const rows = S.rows[s.id] || [];
  const c = rows.length ? C.countRows(rows) : (s.counts || C.countRows([]));
  const group = C.GROUPS.find((g) => g.id === C.showGroup(s, today()));
  const running = E.running && E.showId === s.id;
  const pct = c.total ? Math.round(100 * c.done / c.total) : 0;
  const progress = c.pending ? `<div class="progress" role="status" aria-label="Checking exhibitors, ${pct}% done">
      <p class="num">${running ? '<span class="spinner" aria-hidden="true"></span>Checking now. Keep this open, or leave it: the checks carry on in the background.' : `Paused at ${c.done} of ${c.total}. Tap Keep checking to carry on.`}</p></div>` : '';
  const actions = showActions(s, c);
  const key = [s.id, s.name, s.start, s.end, c.total, c.done, c.corporate, c.check, c.consent, c.google, c.microsoft, running, s.status, s.statusNote, s.urls.length].join('|');
  if (hero.dataset.key !== key) {
    hero.dataset.key = key;
    hero.innerHTML = `${c.total ? '' : barsEmpty()}
      <div class="title-row"><div><h1 class="sat-name">${esc(s.name)}</h1><p class="when num">${esc(group.id === 'undated' ? 'Dates not set' : `${C.fmtDates(s.start, s.end)}, ${group.label.toLowerCase()}`)}</p></div>
      <div class="row-icons">${c.total ? `<button class="ico-btn" type="button" data-act="csv" aria-label="Download CSV" title="Download CSV">${ICON.down}</button>` : ''}<button class="ico-btn" type="button" data-act="show-menu" aria-label="Exhibition options" title="Exhibition options">${ICON.more}</button></div></div>
      ${leadsHtml(null, c, C.summary(c, s))}${progress}
      ${actions ? `<div class="actions">${actions}</div>` : ''}`;
  }
  const f = $('#showFilters');
  if (!c.total) { f.innerHTML = ''; $('#showRows').innerHTML = ''; return; }
  if (!f.dataset.ready) {
    f.dataset.ready = '1';
    f.innerHTML = `<div class="chips filters" id="chipRow" role="group" aria-label="Filter exhibitors"></div>
      <form class="quiet-search" id="searchForm" role="search"><input class="field" id="q" type="search" placeholder="Search this list" autocomplete="off" enterkeyhint="search" aria-label="Search this list" value="${esc(S.q)}"></form>`;
  }
  $('#chipRow').innerHTML = C.FILTERS.filter((x) => x.id === 'all' || x.id === S.filter || C.filterCount(c, x.id) > 0)
    .map((x) => `<button class="chip${x.id === 'corporate' ? ' st st-ok' : x.id === 'check' ? ' st st-check' : x.id === 'consent' ? ' st st-consent' : ''}" type="button" data-filter="${x.id}" aria-pressed="${S.filter === x.id}">${logo(x.id)}${esc(x.label)} <span class="n num">${C.filterCount(c, x.id)}</span></button>`).join('');
  const list = C.filterRows(rows, { filter: S.filter, q: S.q });
  const shown = list.slice(0, S.limit);
  $('#showRows').innerHTML = (shown.length ? shown.map(rowHtml).join('') : `<p class="empty-list">No exhibitors match. Clear the search or choose All.</p>`)
    + (list.length > shown.length ? `<button class="more-btn" type="button" data-act="more">Show ${Math.min(200, list.length - shown.length)} more of ${list.length - shown.length}</button>` : '');
}

function rowHtml(r) {
  const st = C.statusOf(r);
  const who = [r.contact, r.domain].filter(Boolean).join(', ');
  const n = C.listedCount(r);
  const badge = n >= 2 ? `<span class="ex-badge" role="img" aria-label="In ${n} exhibitions" title="In ${n} exhibitions">${ICON.stack}${n}</span>` : '';
  return `<div class="ex"><button class="ex-main${badge ? ' has-badge' : ''}" type="button" data-row="${esc(r.id)}"><span class="dot ${st}"></span>
    <span class="ex-t"><span class="ex-name">${esc(r.name)}</span><span class="ex-sub">${C.rowParts(r).map((b) => logo(b.logo) + esc(b.text)).join(', ')}</span>${who ? `<span class="ex-sub dim">${esc(who)}</span>` : ''}</span>${badge}${ICON.chev}</button></div>`;
}

/* ---------- Sheets ---------- */
const sheet = $('#sheet');
function openSheet(html) {

}
function closeSheet() { if (sheet.open) sheet.close(); }
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
const head = (title) => `<div class="sheet-head"><h2 id="sheetTitle">${esc(title)}</h2><button class="icon-btn" type="button" data-act="close" aria-label="Close">${ICON.x}</button></div>`;

/* Detail */
function kv(label, value, sub) {

function openRow(id) {
  const r = rowById(id);
  if (!r) return;
  const st = C.statusOf(r), s = showById(r.showId) || {};
  const done = st !== 'pending';
  const link = (href, text) => `<a href="${esc(href)}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''}>${esc(text)}</a>`;
  const coUrl = C.companyUrl(r.companyNo);
  const needsAnswer = done && (r.legal === 'likely' || r.legal === 'possible') && r.legalSrc !== 'Confirmed by you';
  const contactSrc = r.contact ? (r.contactSrc ? `From ${r.contactSrc}` : '') : '';
  const emailSub = [C.emailKindLabel(r.emailKind), r.emailSrc ? `from ${r.emailSrc}` : ''].filter(Boolean).join(', ');
  const SURE = { verified: 'Confirmed', likely: 'Likely the same company', possible: 'Possibly the same company' };
  const company = r.companyNo ? [
    kv('Company', esc(r.companyName), [C.companyTypeLabel(r.companyType), r.companyStatus].filter(Boolean).join(', ')),
    kv('Company number', `<span class="v-copy"><span>${coUrl ? link(coUrl, r.companyNo) : esc(r.companyNo)}</span><button class="copy-btn" type="button" data-act="copy-text" data-text="${esc(r.companyNo)}" data-what="Company number" aria-label="Copy company number">${ICON.copy}</button></span>`, r.companyAddr),
    kv('How sure', esc(SURE[r.legal] || ''), r.legalSrc),
    kv('Director', esc(r.chDirector), 'From Companies House'),
  ].join('') : kv('Company', 'No company found', r.legalSrc && r.legalSrc !== 'No company found' ? r.legalSrc : '');
  const others = (r.alsoIn || []).map(showById).filter(Boolean), listed = C.listedCount(r);
  const alsoIn = others.length ? `<div class="kv"><span class="k">Also in</span>${others.map((o) => `<span class="v">${esc(o.name)}</span><span class="s">${esc([o.start ? C.fmtDates(o.start, o.end) : '', o.sector].filter(Boolean).join(' · '))}</span>`).join('')}</div>` : '';
  openSheet(`${head(r.name)}
    <span class="tag ${st}">${esc(C.STATUS_LABEL[st])}</span>${done ? `<span class="tag">${logo(C.providerOf(r))}${esc(C.workspaceShort(r))}</span>` : ''}${listed >= 2 ? `<span class="tag">In ${listed} exhibitions</span>` : ''}
    <p>${esc(C.emailRule(r))}</p>
    ${needsAnswer ? `<div class="actions" style="margin-top:10px"><button class="btn primary" type="button" data-act="match-yes" data-id="${esc(r.id)}">Yes, same company</button><button class="btn" type="button" data-act="match-no" data-id="${esc(r.id)}">No, a different one</button></div>` : ''}
    <h3>Contact</h3>
    ${kv('Email', r.email ? link('mailto:' + r.email, r.email) : '', emailSub)}
    ${kv('Phone', r.phone ? link('tel:' + r.phone.replace(/\s+/g, ''), r.phone) : '', r.phone && r.phoneSrc ? `From ${r.phoneSrc}` : '')}
    ${kv('Contact name', esc(r.contact), contactSrc)}
    ${kv('Website', r.website ? link(r.website, r.website.replace(/^https?:\/\//, '')).replace('<a ', '<a data-chrome="1" ') : '')}
    ${!r.email && !r.phone && !r.contact && !r.website ? '<p class="small">Nothing found yet. Edit the details to add what you know.</p>' : ''}
    <h3>Company</h3>
    ${company}
    <div class="actions" style="margin-top:10px"><button class="btn" type="button" data-act="find-co" data-id="${esc(r.id)}">Find on Companies House</button><button class="btn" type="button" data-act="company-no" data-id="${esc(r.id)}">Enter company number</button></div>
    <h3>Email setup</h3>
    ${kv('Provider', logo(C.providerOf(r)) + esc(C.workspaceLabel(r)))}
    ${done ? kv('Also uses', esc(r.alsoUses), 'From its domain records. Not finding a service does not mean they do not use it.') : ''}
    <h3>At the show</h3>
    ${kv('Exhibition', esc(s.name || ''), s.start ? C.fmtDates(s.start, s.end) : '')}
    ${alsoIn}
    ${kv('Stand', esc(r.stand))}${kv('Category', esc(r.category))}${kv('About', esc(r.blurb))}${kv('Notes', esc(r.note))}
    <div class="actions"><button class="btn primary" type="button" data-act="edit-row" data-id="${esc(r.id)}">Edit details</button>
    <button class="btn" type="button" data-act="recheck" data-id="${esc(r.id)}">Check again</button>
    ${done ? `<button class="btn" type="button" data-act="explain-row" data-id="${esc(r.id)}">Why this result?</button>` : ''}
    <button class="btn" type="button" data-act="remove-row" data-id="${esc(r.id)}">Remove</button></div>`);

/* Why this result? A check run again without saving, with every page it read and what the register said */
function openExplain(id, j) {
  const r = rowById(id) || {};
  const x = C.explainText(r, j);
  S.whyText = x.text;
  openSheet(`${head('Why this result?')}
    <p class="small">${esc(r.name || '')}. This ran the check again without saving anything.</p>
    <div class="why-cmp"><span>Saved on your sheet: <b>${esc(x.saved)}</b></span><span>A fresh check now: <b>${esc(x.now)}</b></span></div>
    ${x.changed ? '<p class="hint">The fresh check differs from what is saved. Use Check again to keep it.</p>' : ''}
    <pre class="why" id="whyText">${esc(x.lines.join('\n') || 'Nothing was read.')}</pre>
    <div class="actions"><button class="btn primary" type="button" data-act="copy-why">Copy</button><button class="btn" type="button" data-act="back-to-row" data-id="${esc(id)}">Back</button></div>`);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
    return ok;
  } catch (e) { return false; }
}

function openEditRow(id) {
  const r = rowById(id);
  if (!r) return;

  openSheet(`${head('Edit details')}
    <form id="editRowForm" data-id="${esc(r.id)}" novalidate>
      ${f('contact', 'Contact name', r.contact)}
      ${f('email', 'Email', r.email, 'type="email" inputmode="email"')}
      ${f('phone', 'Phone', r.phone, 'type="tel" inputmode="tel"')}
      ${f('website', 'Website', r.website, 'type="url" inputmode="url"')}
      <label class="lbl" for="er-note">Notes</label><textarea class="field" id="er-note" name="note" rows="3">${esc(r.note || '')}</textarea>
      <p class="hint">Changing the website or email starts the checks again for this business.</p>
      <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="back-to-row" data-id="${esc(r.id)}">Cancel</button></div>
    </form>`);
}

/* Find on Companies House: search by name (or number), see the matches, choose one and confirm it */
const nice = (t) => { t = String(t || '').replace(/-/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };

function pickListHtml() {
  const p = S.pick || {};
  if (p.err) return `<p class="hint">${esc(p.err)}</p>`;
  if (!p.items) return '';
  if (!p.items.length) return '<p class="hint">Nothing found. Try fewer words, or the company number.</p>';
  return `<div class="menu picks">${p.items.map((c, i) => `<button type="button" data-act="pick-co" data-i="${i}"${c.status && c.status !== 'active' ? ' class="off"' : ''}>${esc(c.name)}<small>${esc([nice(c.status), c.no, C.companyTypeLabel(c.type)].filter(Boolean).join(' · '))}</small>${c.addr ? `<small>${esc(c.addr)}</small>` : ''}</button>`).join('')}</div>`;

function openPicker(id, keep) {
  const r = rowById(id) || {};
  const q = keep ? keep.q : (r.companyName || r.name || '');

/** What the last message did, in words. A check that finishes in the background has no screen to say so, so Settings does. */
function lastNotifyLine(l) {
  const d = l && l.at ? new Date(l.at) : null;
  if (!d || isNaN(d)) return '';
  const time = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' }).format(d);
  const when = d.toDateString() === new Date().toDateString() ? time : new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' }).format(d) + ', ' + time;
  const what = l.kind === 'test' ? 'the test message' : 'the message for ' + (l.show || 'a check');
  return l.ok ? `Last message: ${what} was sent at ${when}.` : `Last message: ${what} could not be sent at ${when}. ${l.error || ''}`.trim();
}
function rememberNotify(ok, error) {
  if (!S.status || !S.status.notify) return;
  S.status = Object.assign({}, S.status, { notify: Object.assign({}, S.status.notify, { last: { at: new Date().toISOString(), kind: 'test', show: '', ok, error: error || '' } }) });
  put('status', S.status);
}

/* The result of the test message, written where you are looking (a pop-up alone is easy to miss). */
function showNotifyResult(msg, bad) {
  document.querySelectorAll('.notify-result').forEach((el) => { el.textContent = msg; el.classList.toggle('bad', !!bad); if (msg && el.offsetParent) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* older browser */ } } });
}

async function connect(url, token) {
  const u = C.validApiUrl(url);
  if (!u) { toast('That does not look like a web app address. It ends in /exec.'); return false; }
  if (!token.trim()) { toast('Add the access token'); return false; }
  const prev = S.api;
  S.api = { url: u, token: token.trim() };
  try {
    const st = await call('status', null, 30000);
    S.status = st; put('status', st);
    S.build = +st.build || 0; put('build', S.build);
    put('api', S.api);
    S.offline = false;
    await refreshShows();
    toast('Connected to your sheet');
    return true;
  } catch (e) {
    S.api = prev;
    toast(e.net ? 'Could not reach that address. Check it and your connection.' : e.message);
    return false;
  }
}

  const opts = C.sectorOptions(S.shows, text);

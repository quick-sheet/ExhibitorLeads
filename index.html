<style>

  --line: rgba(163, 182, 171, 0.1); --line-2: rgba(163, 182, 171, 0.19);
  --ink: #E8EEE9; --ink-2: #A3B6AB; --ink-3: #81978B;
  --sun: #CDB06A; --sun-soft: rgba(205, 176, 106, 0.16); --on-sun: #1C1604;
  --st-ok: #78E4B0; --st-check: #FEC25E; --st-consent: #D7506E;

}

  --st-ok: #71E4B6; --st-check: #FCC35D; --st-consent: #D65076;
  --on-ok: #150F1C; --on-check: #150F1C; --on-consent: #150F1C;
  --scrim: rgba(0, 0, 0, .6); --thin: 300; --status: #150F1C;

}
:root[data-theme="porcelain"] {

}

}

  --ink: #1B241C; --ink-2: #495749; --ink-3: #566656;
  --sun: #2D6A3C; --sun-soft: rgba(45, 106, 60, 0.12); --on-sun: #FFFFFF;
  --st-ok: #339466; --st-check: #AC790B; --st-consent: #A31B41;
  --on-ok: #14100A; --on-check: #14100A; --on-consent: #FFFFFF;

:root[data-theme="sky"] {
  --bg: #EDF1F7; --raise: #FBFCFE; --raise-2: #DFE6F0;

  --ink: #141A2A; --ink-2: #445068; --ink-3: #54617C;
  --sun: #3D4DC0; --sun-soft: rgba(61, 77, 192, 0.12); --on-sun: #FFFFFF;
  --st-ok: #25956F; --st-check: #AF7911; --st-consent: #A31B45;
  --on-ok: #14100A; --on-check: #14100A; --on-consent: #FFFFFF;
  --scrim: rgba(18, 22, 30, .42); --thin: 400; --status: #15181E;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height: 100vh;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 34rem; margin: 0 auto; padding: 0 20px 48px; position: relative; }

/* Header: stays put while the page scrolls */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); transition: box-shadow .2s; }
@supports (backdrop-filter: blur(1px)) and (background: color-mix(in srgb, red, blue)) {
  .top { background: color-mix(in srgb, var(--bg) 94%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
}
.top.scrolled { box-shadow: 0 1px 0 var(--line-2); }
.top::before { content: ""; display: block; height: env(safe-area-inset-top); background: var(--status); }
.top-in { max-width: 34rem; margin: 0 auto; padding: 0 20px 6px; }
header { display: grid; grid-template-columns: 1fr auto; align-items: start; padding: 18px 0 6px; }
.brand { display: flex; align-items: flex-start; gap: 2px; min-width: 0; }
.back { margin: -10px 0 0 -12px; flex: none; }
.mark { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.where { display: flex; font-size: 13px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; min-width: 0; }
.where .wl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.where .wn { flex: none; }
.where .dot { margin: 0 6px; }
.where:empty { display: none; }
.tools { display: flex; gap: 4px; margin: -10px -8px 0 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:active { background: var(--raise); }
.icon-btn svg { width: 22px; height: 22px; }

/* Notices */
.notice { display: flex; gap: 12px; align-items: center; margin: 10px 0 0; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.notice p { margin: 0; flex: 1; }
.notice .link-btn { color: var(--sun); font-weight: 600; white-space: nowrap; text-decoration: none; }
.notice .x { color: var(--ink-3); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.notice .x svg { width: 16px; height: 16px; }

/* Hero */
.hero { padding: 8px 0 22px; }
/* The two bars at the top of each screen: "Can you email them?" and "Who runs their email?" */
.lgroup { margin-top: 20px; max-width: 30em; }
.lgroup-h { margin: 0 0 9px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); letter-spacing: .01em; }
.lbar { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; }
.lbar .seg { flex: 1 1 0; min-width: 4px; display: flex; align-items: center; }
.lbar.email { height: 22px; border-radius: 6px; }
.lbar.email .seg { padding-left: 5px; }
.lbar .seg .logo { width: 13px; height: 13px; }
.seg.corporate { background: var(--st-ok); }
.seg.check { background: var(--st-check); }
.seg.consent { background: var(--st-consent); }
.seg.google { background: var(--prov-g); }
.seg.microsoft { background: var(--prov-m); }
.seg.other { background: var(--prov-o); }
.seg.pending { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px var(--line-2); }
.lgroup .leads { margin-top: 8px; }
.bars-empty { display: grid; gap: 12px; width: min(100%, 300px); margin: 8px auto 22px; }
.bars-empty .lbar .seg { flex-grow: 1; }
:root { --prov-g: var(--raise-2); --prov-m: var(--raise-2); --prov-o: var(--raise); }
@supports (background: color-mix(in srgb, red, blue)) {
  :root { --prov-g: color-mix(in srgb, var(--ink) 24%, var(--raise)); --prov-m: color-mix(in srgb, var(--ink) 15%, var(--raise)); --prov-o: color-mix(in srgb, var(--ink) 7%, var(--raise)); }
}
/* Google and Microsoft tiles */
.logo { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; flex: none; }
.chip .logo { width: 15px; height: 15px; margin-right: 6px; vertical-align: -2px; }
.ex-sub .logo, .tag .logo { width: 13px; height: 13px; margin-right: 4px; vertical-align: -2px; }
.kv .v .logo { margin-right: 6px; }
/* Waiting on Apps Script: a spinner in the button or in the message at the bottom */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 9px; flex: none; }
.btn.busy::after, .menu button.busy::after, .chip.busy::after { content: ''; display: inline-block; width: 13px; height: 13px; margin-left: 8px; vertical-align: -2px; }
/* The comet: a ring in the text colour whose tail fades away behind its head, turning steadily */
.spinner, .btn.busy::after, .menu button.busy::after, .chip.busy::after {
  border-radius: 50%; background: conic-gradient(from 90deg, transparent 10%, currentColor 95%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px));
  animation: spin .8s linear infinite;
}
.menu button { position: relative; }
.menu button.busy::after { position: absolute; right: 4px; top: 50%; margin: -7px 0 0; }
.title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.title-row > :first-child { flex: 1; min-width: 0; }
.row-icons { display: flex; flex: none; margin: -9px -10px 0 0; }
.ico-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); transition: opacity .12s; }
.ico-btn.main { color: var(--sun); }
.ico-btn:active { opacity: .45; }
.ico-btn svg { width: 24px; height: 24px; }
.sat-name { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -.015em; overflow-wrap: anywhere; }
.when { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.story { margin: 14px 0 0; font-size: 18px; font-weight: var(--thin); line-height: 1.55; letter-spacing: .005em; color: var(--ink); max-width: 30em; }
.facts { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.empty-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.empty-body { margin: 8px 0 0; color: var(--ink-2); max-width: 28em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--raise-2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--sun); color: var(--on-sun); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.link-btn { color: var(--ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.bar { height: 6px; border-radius: 3px; background: var(--raise-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 3px; transition: width .4s ease; }

/* Forms */
.field { width: 100%; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); padding: 0 12px; font-size: 16px; }
textarea.field { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
.field::placeholder { color: var(--ink-3); }
.lbl { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); }
/* Link | List on the add form */
.lbl-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 2px; }
.lbl-row .lbl { margin: 0; }
.mode { display: inline-flex; padding: 3px; border-radius: 20px; background: var(--raise-2); flex: none; }
.mode button { min-height: 34px; min-width: 64px; padding: 0 14px; border-radius: 17px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.mode button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.sheet .mode-note { color: var(--ink-2); }
.field-row { display: flex; gap: 8px; margin-top: 10px; }
.field-row .field { flex: 1; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.search-form { margin: 18px 0 0; }
.search-form .field-row { margin-top: 0; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; background: var(--raise-2); font-size: 14px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
/* Status pills: same colours as the stand plan. Soft tint and ring when off, solid when selected. */
.chip.st { --stc: var(--st-ok); --onc: var(--on-ok); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--stc); }
.chip.st-check { --stc: var(--st-check); --onc: var(--on-check); }
.chip.st-consent { --stc: var(--st-consent); --onc: var(--on-consent); }
@supports (background: color-mix(in srgb, red, blue)) {
  .chip.st { background: color-mix(in srgb, var(--stc) 13%, var(--raise-2)); }
}
.chip.st[aria-pressed="true"] { background: var(--stc); color: var(--onc); box-shadow: none; }
.chip .n { font-size: 12.5px; opacity: .8; }
.filters { margin: 4px 0 0; }
.quiet-search { margin: 12px 0 0; }

/* Lists */
.day { margin: 26px 0 2px; font-size: 14px; font-weight: 500; color: var(--ink-3); }
.section-title { margin: 32px 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.section-note { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-3); }
/* Find exhibitions: listings you browse yourself, the Google searches, and how a show gets from there into the app */
.finder { margin-top: 30px; }
.finder-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.finder-head .section-title { margin: 0; }
.finder-head .ico-btn { margin-right: -10px; }
.how { list-style: none; margin: 10px 0 0; padding: 14px 10px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border-radius: 18px;
  background: linear-gradient(180deg, var(--raise), var(--bg)); border: 1px solid var(--line); counter-reset: how; }
.how li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 7px; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); }
.how li + li::before { content: ''; position: absolute; top: 17px; left: calc(-50% + 22px); width: calc(100% - 44px); border-top: 1px dashed var(--line-2); }
.how .hi { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--sun-soft); color: var(--sun); }
.how .hi svg { width: 19px; height: 19px; }
.finder-sub { margin: 20px 2px 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; }
.finder-sub span { font-weight: 400; color: var(--ink-3); }
.src-group { border-radius: 18px; background: var(--raise); border: 1px solid var(--line); overflow: hidden; }
.src { display: flex; align-items: center; }
.src + .src { border-top: 1px solid var(--line); }
.src-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 38px minmax(0, 1fr) 18px; align-items: center; column-gap: 12px; padding: 10px 14px; min-height: 60px; color: inherit; text-decoration: none; transition: background .12s; }
.src-main:active { background: var(--raise-2); }
.src-main > svg { width: 18px; height: 18px; color: var(--ink-3); }
.tile { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: -.02em; background: var(--raise-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.tile.g { background: #fff; box-shadow: none; }
.tile.g .logo { width: 20px; height: 20px; }
.tile.mine { background: var(--sun-soft); color: var(--sun); box-shadow: none; }
.src-name { display: block; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-sub { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-x { width: 44px; height: 44px; flex: none; display: grid; place-items: center; color: var(--ink-3); margin-right: 4px; }
.src-x svg { width: 18px; height: 18px; }
/* Show diary: researched shows for a sector, each with its date mark, its links and a plus to add it */
.dy-key { display: flex; flex-wrap: wrap; gap: 0 14px; margin: 10px 0 0; }
.dy-st { --stc: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; min-height: 32px; min-width: 0; font-size: 13px; font-weight: 500; color: var(--stc); text-decoration: none; }
@supports (color: color-mix(in srgb, red, blue)) {
  .dy-st { color: color-mix(in srgb, var(--stc) 62%, var(--ink)); }   /* the words a shade deeper than the mark, so they read on light themes */
}
.dy-st svg { width: 15px; height: 15px; flex: none; color: var(--stc); }
.dy-st.organiser { --stc: var(--st-ok); }
.dy-st.listing { --stc: var(--st-check); }
a.dy-st:active { opacity: .45; }
.dy { padding: 14px 0 4px; border-bottom: 1px solid var(--line); }
.dy p { margin: 0; }
.dy-type { font-size: 12.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .01em; }
.dy .dy-name { margin-top: 1px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.dy-name span { font-weight: 400; color: var(--ink-2); }
.dy .dy-when { margin-top: 3px; font-size: 14px; }
.dy-when b { color: var(--sun); font-weight: 600; }
.dy-venue { font-size: 14px; color: var(--ink-2); }
.dy .dy-who { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); max-width: 32em; }
.dy .dy-note { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line-2); font-size: 13px; color: var(--ink-3); }
.dy-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.dy-ico { display: flex; flex: none; margin-right: -10px; }

/* reading a show's own website in Add exhibition */

.look.ok { color: var(--ink); background: color-mix(in srgb, var(--st-ok) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--st-ok) 40%, transparent); }

.ex-sub.dim { color: var(--ink-3); }
.ex-t { min-width: 0; }

.dot.check { background: var(--st-check); }
.dot.consent { background: var(--st-consent); }

.more-btn { display: block; width: 100%; padding: 14px 0; text-align: left; font-size: 14px; font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--line); }

/* Sheets */
dialog.sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 34rem; max-height: 90vh;
  border: 0; border-radius: 22px 22px 0 0; padding: 0; background: var(--raise); color: var(--ink);

}

.swipe-back { position: fixed; left: 12px; top: 50%; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; background: var(--raise-2); color: var(--ink);
  display: grid; place-items: center; opacity: 0; pointer-events: none; z-index: 20; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }

.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }

.kv { padding: 10px 0; border-bottom: 1px solid var(--line); }

.kv .v { display: block; font-size: 16px; color: var(--ink); overflow-wrap: anywhere; user-select: text; }

.menu { margin: 14px 0 0; }
.menu button { display: block; width: 100%; text-align: left; padding: 15px 0; min-height: 52px; border-bottom: 1px solid var(--line); font-weight: 500; font-size: 16px; }
.menu button small { display: block; font-weight: 400; font-size: 13.5px; color: var(--ink-3); margin-top: 1px; }

.tag { display: inline-block; padding: 3px 10px; border-radius: 12px; background: var(--raise-2); font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 10px 8px 0 0; }

/* How many exhibitions a business is in, copying the company number, and the Companies House picker */
.ex-main.has-badge { grid-template-columns: 12px 1fr auto 18px; }
.ex-badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 7px; border-radius: 12px; background: var(--raise-2); color: var(--ink-2); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
.ex-badge svg { width: 14px; height: 14px; }
.leads .pct { color: var(--ink-3); font-size: .86em; margin-left: 2px; font-variant-numeric: tabular-nums; }
.v-copy { display: flex; align-items: center; gap: 2px; }
.copy-btn { width: 40px; height: 40px; margin: -8px 0 -8px 2px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; flex: none; }

.menu.picks button { padding: 12px 0; }
.menu.picks button.off { opacity: .75; }
.ex-note { font-size: 13.5px; color: var(--ink-3); margin: 4px 0 0; }
/* Notification setup steps */
.steps { list-style: none; counter-reset: st; margin: 14px 0 0; padding: 0; }

.steps li::before { content: counter(st); position: absolute; left: 0; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--raise-2); color: var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 600; }

.code { display: block; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: text; }
.code { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 14px; word-break: break-all; user-select: all; }

/* Find shows */
.find { margin: 4px 0 4px; padding: 14px; border-radius: 18px; background: var(--raise); border: 1px solid var(--line); animation: drop .18s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
.combo { position: relative; flex: 1; min-width: 0; }
.combo .field { padding-right: 46px; }
.combo-btn { position: absolute; right: 0; top: 0; width: 46px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 12px; }

.opt:last-child { border-bottom: 0; }

.leads li.head { grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; }
.leads .lk.mark { width: 18px; height: 18px; margin-top: 0; background: none; display: grid; place-items: center; }
.tick { width: 18px; height: 18px; display: block; }
.tick circle { fill: var(--raise-2); }
.tick path { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lk.mark .spinner { margin: 0; width: 14px; height: 14px; color: var(--ink-2); }
.lk.mark .ring { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink-3); }
.leads .head .sub { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.run-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--raise-2); margin-left: 8px; flex: none; }
.run-btn.go { background: var(--sun); color: var(--on-sun); }
.run-btn svg { width: 22px; height: 22px; fill: currentColor; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.leads .lk.corporate { background: var(--st-ok); }
.leads .lk.check { background: var(--st-check); }
.leads .lk.consent { background: var(--st-consent); }

/* How matches were made, speed and rechecks, in Settings */
.ev { display: grid; gap: 8px; margin-top: 10px; }
.ev-row { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); }
.ev-row b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.sp-row { margin-top: 10px; }
.why { margin: 10px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--bg); color: var(--ink-2); font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }

.rc-grid .head { font-size: 12.5px; color: var(--ink-3); text-align: right; }
/* Colour theme and usage, both in Settings */
.use { margin-top: 12px; }
.use-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; font-size: 14px; color: var(--ink-2); }
.use-row b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 4px; margin-top: 8px; }
.theme-opt { display: grid; justify-items: center; gap: 6px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); }
.theme-opt[aria-pressed="true"] { color: var(--ink); }
.sw { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2);
  background: radial-gradient(circle, var(--b) 0 6px, transparent 7px), radial-gradient(circle at 50% 35%, var(--c), var(--a)); }
.theme-opt[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sun); }

/* Toast. It is a popover, which the browser draws in its top layer, so it shows above an open sheet (a sheet is a modal dialog
   and covers any ordinary element, whatever its z-index). The resets below undo the browser's own popover box. */
.toast { position: fixed; inset: auto auto calc(24px + env(safe-area-inset-bottom)) 50%; margin: 0; border: 0; width: max-content; height: auto; overflow: visible; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 22px; font-size: 14px; font-weight: 500; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px); text-align: center; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.notify-result { margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

  .spinner, .btn.busy::after, .menu button.busy::after, .chip.busy::after { animation: spin 1.6s linear infinite !important; }
}

<script>
(() => {
'use strict';
const C = window.Core;
const LOAD_FAIL = '<section class="hero"><h1 class="empty-title">Exhibitor Leads could not load</h1><p class="empty-body">Part of the app did not arrive. Close it fully and open it again.</p></section>';
if (!C) { document.getElementById('main').innerHTML = LOAD_FAIL; return; }

/* ---------- Platform ---------- */
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isAndroid = /Android/.test(UA);


/* ---------- Storage ---------- */
const P = 'exl.';
const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };
const drop = (k) => { try { localStorage.removeItem(P + k); } catch {} };

const THEMES = [
  { id: 'harbour', name: 'Harbour', bg: '#0E1426', card: '#161D36', accent: '#F2C063' },
  { id: 'graphite', name: 'Graphite', bg: '#121315', card: '#1B1D20', accent: '#6CAAFF' },
  { id: 'forest', name: 'Forest', bg: '#0D1512', card: '#15201B', accent: '#CDB06A' },
  { id: 'aubergine', name: 'Aubergine', bg: '#150F1C', card: '#1F1729', accent: '#F29DBF' },
  { id: 'porcelain', name: 'Porcelain', bg: '#F5F4EF', card: '#FFFFFF', accent: '#0B6B6B' },
  { id: 'stone', name: 'Stone', bg: '#F2EDE5', card: '#FCF9F4', accent: '#B04526' },
  { id: 'sage', name: 'Sage', bg: '#EEF1EA', card: '#FAFBF8', accent: '#2D6A3C' },
  { id: 'sky', name: 'Sky', bg: '#EDF1F7', card: '#FBFCFE', accent: '#3D4DC0' },
];

const S = {
  api: get('api', null),            // { url, token }
  shows: get('shows', []),
  searches: get('searches', {}),
  showsAt: get('showsAt', 0),
  rows: {},                         // showId -> rows
  route: { v: 'home' },
  diaries: {}, diaryType: 'all',   // the show diaries read this session, and the type chosen on the diary screen
  filter: 'all', q: '', limit: 200,
  set: Object.assign({ theme: 'harbour', lastSector: '' }, get('settings', {})),
  status: get('status', null),
  build: get('build', null),
  usage: null,                      // the last 24 hours, from the sheet. Never saved, so it is never stale
  usageHidden: '',
  offline: false, offlineMsg: '',
  installEvt: null,
  shared: null,
  busy: {},
};
const E = { running: false, stop: false, showId: null, idle: 0 };   // the checking loop
const saveSet = () => put('settings', S.set);

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = C.esc;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const showById = (id) => S.shows.find((s) => s.id === id);
const today = () => C.todayIso();

let toastTimer, toastHide;
/** A message at the bottom that stays, with a spinner, until toast() replaces it with the answer. */
function busyToast(msg) {
  toast(msg);
  clearTimeout(toastTimer); clearTimeout(toastHide);
  $('#toast').innerHTML = '<span class="spinner" aria-hidden="true"></span>' + esc(msg);
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  clearTimeout(toastTimer); clearTimeout(toastHide);
  // Shown as a popover so it sits above an open sheet. Showing it again puts it back on top. An older browser just shows it as before.
  try { if (t.showPopover) { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } } catch (e) { /* no popover support */ }
  void t.offsetWidth;   // so it fades in rather than appearing
  t.classList.add('show');
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    toastHide = setTimeout(() => { try { if (t.matches(':popover-open')) t.hidePopover(); } catch (e) { /* no popover support */ } }, 260);
  }, Math.max(2600, msg.length * 55));
}

/* ---------- Talking to the sheet ---------- */
class ApiError extends Error {}

async function call(action, data, ms) {
  if (!S.api) throw new ApiError('Connect your sheet first');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 60000);
  let j;
  try {
    const r = await fetch(S.api.url, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.api.token }, data || {})), signal: ctl.signal });
    j = await r.json();
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError' ? 'Your sheet took too long to answer' : 'Could not reach your sheet');
    err.net = true;
    throw err;
  } finally { clearTimeout(timer); }
  if (j && j.error) throw new ApiError(j.error === 'Unauthorised' ? 'The token is not right. Check it in Settings.' : j.error);
  return j || {};
}

function setOffline(err) {
  S.offline = !!(err && err.net);
  S.offlineMsg = err ? err.message : '';
  renderNotices();
}

/* ---------- Data ---------- */
function totals() {
  const t = { total: 0, done: 0, corporate: 0, consent: 0, check: 0, google: 0, microsoft: 0, pending: 0 };
  S.shows.forEach((s) => { const c = s.counts || {}; Object.keys(t).forEach((k) => { t[k] += c[k] || 0; }); });
  return t;
}

// The same warning stays hidden once dismissed, even as the percentage creeps up. A change of kind brings it back.
const usageKey = () => (S.usage && S.usage.warn ? S.usage.message.replace(/\d+%/, '') : '');

function setUsage(u) {
  S.usage = C.usage(u);
  renderNotices();
  const box = $('#usageBox');
  if (box && sheet.open) box.outerHTML = usageHtml();
}

// The sheet's own summary of its checks (how matches were made, speed, rechecks). Optional: Settings simply shows what it last had.
// A phone updated before the Apps Script was: the sheet does not know the new action yet.
const oldScript = (e) => (/unknown action/i.test(e.message || '') ? 'Your Apps Script needs its new version first. The README says how (Update).' : e.message);

// The release of Apps Script code this app expects. Shown in Settings; a warning appears when the script behind the app is older.
const EXPECT_BUILD = 17;

async function checkBuild() {
  if (!S.api) return;
  try { const j = await call('ping', null, 20000); S.build = +j.build || 0; put('build', S.build); renderNotices(); } catch (e) { /* offline: keep what we knew */ }
}

async function refreshStatus() {
  if (!S.api) return;
  try { const j = await call('status'); S.status = j; put('status', j); setUsage(j.usage); } catch (e) { /* not needed to carry on */ }
}

async function refreshShows() {
  if (!S.api) return false;
  try {
    const j = await call('list');
    const changed = JSON.stringify(j.shows || []) !== JSON.stringify(S.shows) || (j.searches && JSON.stringify(j.searches) !== JSON.stringify(S.searches));
    S.shows = j.shows || [];
    if (j.searches) { S.searches = j.searches; put('searches', S.searches); }
    setUsage(j.usage);
    S.showsAt = Date.now();
    put('shows', S.shows); put('showsAt', S.showsAt);
    setOffline(null);
    if (changed && (S.route.v === 'home' || S.route.v === 'sector' || S.route.v === 'diary')) renderMain();
    return true;
  } catch (e) { setOffline(e); if (!e.net) toast(e.message); return false; }
}

function cachedRows(id) { return get('rows.' + id, []); }
function saveRows(id) {
  put('rows.' + id, S.rows[id] || []);
  let ids = get('rowIds', []).filter((x) => x !== id);
  ids.unshift(id);
  ids.slice(6).forEach((old) => drop('rows.' + old));
  put('rowIds', ids.slice(0, 6));
}
function syncCounts(id) {
  const s = showById(id);
  if (s && S.rows[id]) { s.counts = C.countRows(S.rows[id]); put('shows', S.shows); }
}
async function fetchRows(id) {
  const j = await call('rows', { showId: id });
  S.rows[id] = j.rows || [];
  saveRows(id); syncCounts(id);
  setOffline(null);
}
function mergeRows(id, changed) {
  if (!changed || !changed.length) return;
  const list = S.rows[id] || (S.rows[id] = []);
  const at = new Map(list.map((r, i) => [r.id, i]));
  changed.forEach((r) => {
    if (at.has(r.id)) {
      const old = list[at.get(r.id)];
      if (old && old.alsoIn && !r.alsoIn) r.alsoIn = old.alsoIn;   // a check or an edit does not say which other exhibitions a business is in
      list[at.get(r.id)] = r;
    } else { at.set(r.id, list.length); list.push(r); }
  });
  saveRows(id); syncCounts(id);
}
const rowById = (id) => { const l = S.rows[S.route.showId] || []; return l.find((r) => r.id === id); };

/* ---------- Checking loop ---------- */
async function runChecks(id) {
  if (E.running) return;
  const show = showById(id);
  if (!show) return;
  Object.assign(E, { running: true, stop: false, showId: id, idle: 0 });
  updateShow();
  let moved = false;
  try {
    while (!E.stop) {
      if (!(S.route.v === 'show' && S.route.showId === id && document.visibilityState === 'visible')) { moved = document.visibilityState === 'visible'; break; }
      const r = await call('enrich', { showId: id, budget: 20 }, 70000);
      mergeRows(id, r.changed);
      if (r.usage) setUsage(r.usage);
      setOffline(null);
      updateShow();
      if (r.pending <= 0) break;
      if (!r.processed) {
        // someone else (the background check) has the rest: look again shortly
        if (++E.idle > 20) break;
        await sleep(8000);
        await fetchRows(id).catch(() => {});
        updateShow();
        if (!(S.rows[id] || []).some((x) => C.statusOf(x) === 'pending')) break;
      } else E.idle = 0;
    }
  } catch (e) {
    setOffline(e);
    if (!e.net) toast(e.message);
  } finally {
    E.running = false;
    updateShow();
    if (moved) ensureChecking();   // went to another screen: carry on there
  }
}
/**
 * On the home and sector screens the app checks too, across every exhibition with leads waiting, so a recheck started from
 * Settings moves while you watch instead of waiting for the background run. The counts come back from the sheet after each step.
 */
async function runAllChecks() {
  if (E.running) return;
  const here = () => (S.route.v === 'home' || S.route.v === 'sector') && document.visibilityState === 'visible';
  Object.assign(E, { running: true, stop: false, showId: '*', idle: 0 });
  let moved = false;
  renderMain();
  try {
    while (!E.stop) {
      if (!here()) { moved = true; break; }
      // on a sector's screen, that sector's exhibitions one after another; on the home screen, any exhibition
      const ids = S.route.v === 'sector' ? S.shows.filter((x) => x.sector === S.route.sector && (x.counts || {}).pending > 0).map((x) => x.id) : null;
      if (ids && !ids.length) break;
      const r = await call('enrich', ids ? { showId: ids[0], budget: 20 } : { budget: 20 }, 70000);
      const by = {};
      (r.changed || []).forEach((x) => { (by[x.showId] = by[x.showId] || []).push(x); });
      Object.keys(by).forEach((id) => { if (S.rows[id]) mergeRows(id, by[id]); });   // keep any exhibition already on the phone up to date
      if (r.usage) setUsage(r.usage);
      setOffline(null);
      await refreshShows();   // redraws the screen when the counts have moved
      if (r.pending <= 0 && !ids) break;
      if (!r.processed) { if (++E.idle > 20) break; await sleep(8000); } else E.idle = 0;
    }
  } catch (e) {
    setOffline(e);
    if (!e.net) toast(e.message);
  } finally {
    E.running = false;
    if (S.route.v === 'home' || S.route.v === 'sector') renderMain();
    if (moved) ensureChecking();   // went into an exhibition: carry on there
  }
}
/**
 * The first line of the leads: "163 exhibitors" with a tick once all are checked; while leads wait, "111 of 135 checked" with a
 * spinner (a still ring when paused), "24 waiting · about 2 minutes" under it, and a round pause or play button.
 */
function topLine(h, running) {
  const nums = `<strong class="num">${esc(h.n)}</strong> ${esc(h.text)}`;
  if (h.done) return `<li class="head done"><i class="lk mark">${ICON.allDone}</i><span>${nums}<span class="vh">, all checked</span></span></li>`;
  const per = S.status && S.status.speed && S.status.speed.seconds;
  return `<li class="head progress"><i class="lk mark" aria-hidden="true">${running ? '<span class="spinner"></span>' : '<span class="ring"></span>'}</i>
    <span>${nums}<span class="sub" role="status">${esc(C.waitingLine(h.pending, per, running))}</span></span>
    ${running ? `<button class="run-btn" type="button" data-act="pause" aria-label="Pause checking" title="Pause checking">${ICON.pause}</button>`
    : `<button class="run-btn go" type="button" data-act="resume" aria-label="Keep checking" title="Keep checking">${ICON.play}</button>`}</li>`;
}
const pendingAll = () => S.shows.filter((s) => S.route.v !== 'sector' || s.sector === S.route.sector).reduce((a, s) => a + ((s.counts || {}).pending || 0), 0);

function ensureChecking() {
  if (E.running || E.userPaused || !S.api || document.visibilityState !== 'visible') return;
  const id = S.route.showId;
  if (S.route.v === 'show') { if (id && (S.rows[id] || []).some((r) => C.statusOf(r) === 'pending')) runChecks(id); }
  else if ((S.route.v === 'home' || S.route.v === 'sector') && pendingAll() > 0) runAllChecks();
}
// While leads are waiting and nothing is checking here (paused, or offline a moment), the counts still follow the background run.
setInterval(() => {
  if (!S.api || E.running || document.visibilityState !== 'visible' || !(S.route.v === 'home' || S.route.v === 'sector') || !pendingAll()) return;
  refreshShows();
}, 60000);

/* ---------- Routing ---------- */
function go(route, replace) {
  const was = S.route;
  S.route = route;
  S.filter = 'all'; S.q = ''; S.limit = 200;
  // each step remembers the screen it came from, so going up can step back instead of adding to the history
  if (replace) history.replaceState({ r: route, prev: (history.state || {}).prev || null }, ''); else history.pushState({ r: route, prev: was || null }, '');
  E.userPaused = false;
  enter();
  window.scrollTo(0, 0);
}
/** The screen one level up: a sector goes home, an exhibition goes to its sector. Null on the home screen. */
function parentOf(r) {
  if (!r || r.v === 'home') return null;
  if (r.v === 'show') { const s = showById(r.showId); return s ? { v: 'sector', sector: s.sector } : { v: 'home' }; }
  if (r.v === 'diary') return { v: 'sector', sector: r.sector };
  return { v: 'home' };
}
const sameRoute = (a, b) => !!a && !!b && a.v === b.v && (a.v === 'home' || (a.v === 'sector' || a.v === 'diary' ? a.sector === b.sector : a.showId === b.showId));
/** Up one level, the same whichever way you arrived: back when you came from there, otherwise straight to it. */
function goUp() {
  const up = parentOf(S.route);
  if (!up) return false;
  closeFind();
  if (history.state && sameRoute(history.state.prev, up)) { history.back(); return 'back'; }
  go(up, true);
  return 'go';
}
window.addEventListener('popstate', (e) => {
  S.route = (e.state && e.state.r) || { v: 'home' };
  S.filter = 'all'; S.q = ''; S.limit = 200;
  closeSheet(); closeFind();
  enter();
  window.scrollTo(0, 0);   // going back shows the screen from its top, not where it was left
});
async function enter() {
  render();
  const r = S.route;
  if (r.v === 'show') {
    const id = r.showId;
    if (!S.rows[id]) S.rows[id] = cachedRows(id);
    updateShow();
    try { await fetchRows(id); } catch (e) { setOffline(e); if (!e.net) toast(e.message); }
    if (S.route.showId !== id) return;
    updateShow();
    ensureChecking();
  } else {
    if (r.v === 'diary') loadDiary(r.sector);
    if (S.api) { await refreshShows(); ensureChecking(); }
  }
}

/* ---------- Rendering: shell ---------- */
function render() {
  renderHeader();
  renderNotices();
  renderMain();
}

function renderHeader() {
  const r = S.route;
  $('#back').hidden = r.v === 'home';
  $('#searchBtn').hidden = !S.api;
  if (!S.api) closeFind();
  let w = { label: '', count: '' };
  if (r.v === 'home') w.label = S.api ? (S.shows.length ? C.plural(S.shows.length, 'exhibition') : 'Ready') : 'Not connected';
  // the sector's exhibitions; an exhibition's own exhibitors, checked or not
  else if (r.v === 'sector') w = C.whereParts('Sector', S.shows.filter((x) => x.sector === r.sector).length, 'exhibition');
  else if (r.v === 'diary') { const d = diaryData(r.sector); w = C.whereParts('Show diary', d ? C.diaryView(d, null, today(), []).total : 0, 'show'); }
  else { const s = showById(r.showId), rows = S.rows[r.showId]; if (s) w = C.whereParts(s.sector, rows && rows.length ? rows.length : (s.counts || {}).total, 'exhibitor'); }
  const html = w.label ? `<span class="wl">${esc(w.label)}</span>${w.count ? `<span class="wn num"><span class="dot">·</span>${esc(w.count)}</span>` : ''}` : '';
  const el = $('#where');
  if (el.innerHTML !== html) el.innerHTML = html;
}

function renderNotices() {
  const out = [];
  const dismissed = get('dismissed', {});
  if (S.offline && S.api) out.push(`<div class="notice"><p>${esc(S.offlineMsg || 'Could not reach your sheet')}. Showing what is saved on this phone.</p><button class="link-btn" type="button" data-act="retry">Retry</button></div>`);
  if (S.api && !S.offline && C.scriptOutdated(S.build, EXPECT_BUILD)) {
    out.push(`<div class="notice"><p>Your Apps Script is out of date (${S.build ? 'release ' + esc(S.build) : 'an older release'}, this app needs ${EXPECT_BUILD}). Paste the new Code.gs and deploy a new version, or the newer checks will not run.</p><button class="link-btn" type="button" data-act="settings">Details</button></div>`);
  }
  if (!standalone && !dismissed.install) {
    if (S.installEvt) out.push(`<div class="notice"><p>Add Exhibitor Leads to your home screen for one-tap access.</p><button class="link-btn" type="button" data-act="install">Install</button><button class="x" type="button" data-dismiss="install" aria-label="Dismiss">${ICON.x}</button></div>`);
    else if (isIOS) out.push(`<div class="notice"><p>Add Exhibitor Leads to your Home Screen: tap Share, then Add to Home Screen.</p><button class="x" type="button" data-dismiss="install" aria-label="Dismiss">${ICON.x}</button></div>`);
  }
  if (S.api && !S.offline && S.usage && S.usage.warn && S.usageHidden !== usageKey()) {
    out.push(`<div class="notice"><p>${esc(S.usage.message)}</p><button class="link-btn" type="button" data-act="settings">Details</button><button class="x" type="button" data-act="hide-usage" aria-label="Dismiss">${ICON.x}</button></div>`);
  }
  $('#notices').innerHTML = out.join('');
}

function renderMain() {
  const r = S.route;
  $('#main').innerHTML = r.v === 'sector' ? sectorHtml(r.sector) : r.v === 'diary' ? diaryHtml(r.sector) : r.v === 'show' ? showShellHtml() : homeHtml();
  renderHeader();
  if (r.v === 'show') updateShow();
}

/* ---------- Google and Microsoft tiles, and the two bars ---------- */
const LOGO = {
  google: '<img class="logo" src="google.png" alt="" width="16" height="16" decoding="async">',
  microsoft: '<img class="logo" src="microsoft.png" alt="" width="16" height="16" decoding="async">',
};
const logo = (k) => LOGO[k] || '';
/** Before there is anything to count: two empty bars, as a picture of what will come. */
const barsEmpty = () => '<div class="bars-empty" aria-hidden="true"><div class="lbar"><i class="seg pending"></i></div><div class="lbar email"><i class="seg pending"></i></div></div>';

/* ---------- Home ---------- */
function homeHtml() {
  if (!S.api) {
    return `<section class="hero">${barsEmpty()}
      <h1 class="empty-title">Connect your sheet</h1>
      <p class="empty-body">Exhibitor Leads keeps everything in your own Google Sheet. Add the web app address and token once, and it is ready.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="settings">Connect</button></div></section>`;
  }
  const t = totals(), sectors = C.sectorsFrom(S.shows);
  const has = S.shows.length > 0;
  const head = { n: String(S.shows.length), text: `${S.shows.length === 1 ? 'exhibition' : 'exhibitions'} in ${C.plural(sectors.length, 'sector')}` };
  return `<section class="hero" id="homeHero">${t.total ? '' : barsEmpty()}
      <h1 class="empty-title">${has ? 'Your leads' : 'Who are you selling to?'}</h1>
      ${has ? leadsHtml(head, t, 'No exhibitors loaded yet.', E.running && E.showId === '*' && !E.stop) : `<p class="empty-body">Tap the search icon, or the button below, and choose a sector such as baby, whisky or crafts. You get searches to find the shows, then Exhibitor Leads reads each exhibitor list for you.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="open-search">Find shows</button></div>`}
    </section>
    ${sectors.length ? `<h2 class="section-title">Your sectors</h2>${sectors.map(sectorRow).join('')}` : ''}`;
}

/**
 * "Your leads": the counts, then two groups, each a bar with its own lines underneath in the same colours and order:
 * "Can you email them?" and "Who runs their email?". Falls back to a sentence while there is nothing to count.
 */
function leadsHtml(head, c, fallback, running) {
  const li = (l) => `<li><i class="lk${l.k ? ' ' + l.k : ''}" aria-hidden="true">${logo(l.k)}</i><span>${l.n ? `<strong class="num">${esc(l.n)}</strong>${l.pct ? ` <span class="pct">(${esc(l.pct)})</span>` : ''} ` : ''}${esc(l.text)}</span></li>`;
  const g = C.leadGroups(c);
  if (!g && !head) return `<p class="story">${esc(fallback)}</p>`;
  const total = g ? g.status.bar.reduce((a, x) => a + x.n, 0) : 0;

    <ul class="leads">${grp.lines.map(li).join('')}</ul></div>`;
  return `<ul class="leads">${head ? li(head) : ''}${g ? topLine(g.head, running) : li({ n: '', text: fallback })}</ul>`
    + (g ? group('Can you email them?', 'status', g.status) + (g.email ? group('Who runs their email?', 'email', g.email) : '') : '');

/* ---------- Show diary ---------- */
// A file in the app (diary-baby.json) of shows researched for a sector. Read once a session, kept on the phone for offline.
const DIARY_MARK = { organiser: ICON.tick, listing: ICON.warn, tbc: ICON.later };
/** The diary for a sector: this session's copy, or the one kept on the phone. */
function diaryData(sector) {
  const file = C.diaryFile(sector);
  if (!file) return null;
  if (!S.diaries[file]) { const kept = get('diary.' + file, null); if (kept && Array.isArray(kept.shows)) S.diaries[file] = kept; }
  return S.diaries[file] || null;
}
function diaryEntry(i) { const d = diaryData(S.route.sector); return d ? d.shows[+i] || null : null; }
/** Reads the diary file (the newest one the app has), shows it if it changed, and keeps it for offline. */
async function loadDiary(sector) {
  const file = C.diaryFile(sector);
  if (!file) return;
  const was = JSON.stringify(diaryData(sector));
  const here = () => S.route.v === 'diary' && C.diaryFile(S.route.sector) === file;
  try {
    const r = await fetch(file, { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j || !Array.isArray(j.shows)) throw new Error('not a diary');
    S.diaries[file] = j; put('diary.' + file, j); S.diaryFail = false;
    if (was !== JSON.stringify(j) && here()) renderMain();
  } catch (e) {
    if (!S.diaries[file]) { S.diaryFail = true; if (here()) renderMain(); }
  }
}

/* ---------- Gestures ----------
 * Swipe right on a screen to go up a level (an exhibition to its sector, a sector to home). Swipe right on a popup to close it,
 * or, where the popup has its own Back (Why this result?, Enter company number), to go back one step. Drag a popup's handle or
 * title down to close it. The screen follows your finger; let go past a third of the way, or flick, and it happens, otherwise it
 * springs back. Never on text boxes or anything that scrolls sideways, and never when the swipe is mostly
 * up or down, so scrolling is untouched. With less motion asked for, nothing slides: the arrow shows and it simply happens. */
const G = { on: null };
const lessMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const NO_SWIPE = 'input, textarea, select, [contenteditable], .find';
function scrollsSideways(el, stop) {
  for (let x = el; x && x !== stop && x !== document.body && x.nodeType === 1; x = x.parentElement) {
    if (x.scrollWidth > x.clientWidth + 2 && /auto|scroll/.test(getComputedStyle(x).overflowX)) return true;
  }
  return false;
}
function dragEl(g) { return g.kind === 'page' ? $('#main') : sheet; }
function dragTo(g, px) {
  const el = dragEl(g), arrow = $('#swipeBack');
  if (g.kind === 'page') {
    const p = Math.min(1, px / (innerWidth / 3));
    arrow.style.opacity = String(p); arrow.classList.toggle('ready', p >= 1);
    arrow.style.transform = `translateX(${Math.round(Math.min(px / 4, 16))}px)`;
  }
  if (lessMotion()) return;
  el.style.transform = g.kind === 'down' ? `translateY(${px}px)` : `translateX(${px}px)`;
}
function dragReset(g) {
  const el = dragEl(g), arrow = $('#swipeBack');
  el.style.transition = ''; el.style.transform = ''; el.style.willChange = '';
  arrow.style.opacity = '0'; arrow.style.transform = ''; arrow.classList.remove('ready');
}
function dragDone(g) {
  if (g.kind === 'page') return goUp();
  if (g.kind === 'sheet') { const back = sheet.querySelector('[data-act=back-to-row], [data-act=pick-back]'); if (back) back.click(); else closeSheet(); }
  else closeSheet();
  return 'go';
}
/** Puts the screen back in place once the new one is drawn: at once, or when the browser has stepped back (a moment later). */
function dragSettle(g, how) {
  if (how !== 'back') { dragReset(g); return; }
  let done = false;
  const fin = () => { if (!done) { done = true; requestAnimationFrame(() => dragReset(g)); } };
  addEventListener('popstate', fin, { once: true });
  setTimeout(fin, 400);
}
function dragEnd(g, at) {
  const el = dragEl(g);
  const d = g.kind === 'down' ? g.dy : g.dx, size = g.kind === 'down' ? el.getBoundingClientRect().height : innerWidth;
  const fast = d > 40 && d / Math.max(1, at - g.t0) > 0.5;
  const go = d > size / (g.kind === 'down' ? 4 : 3) || fast;
  if (lessMotion()) { dragReset(g); if (go) dragDone(g); return; }
  el.style.transition = 'transform .18s cubic-bezier(.2, .8, .2, 1)';
  if (!go) { el.style.transform = ''; $('#swipeBack').style.opacity = '0'; setTimeout(() => dragReset(g), 190); return; }
  el.style.transform = g.kind === 'down' ? 'translateY(100%)' : `translateX(${innerWidth}px)`;
  setTimeout(() => dragSettle(g, dragDone(g)), 170);
}
document.addEventListener('touchstart', (e) => {
  G.on = null;
  if (e.touches.length !== 1) return;
  const t = e.touches[0], target = e.target;
  const inSheet = sheet.open && sheet.contains(target);
  if (sheet.open && !inSheet) return;   // the dimmed backdrop: a tap there closes, that is all
  const g = { x0: t.clientX, y0: t.clientY, t0: e.timeStamp, dx: 0, dy: 0, dir: '' };
  if (inSheet && target.closest('.grabber, .sheet-head') && !target.closest('button, a') && sheet.scrollTop <= 0) { G.on = Object.assign(g, { kind: 'down' }); return; }
  if (target.closest(NO_SWIPE) || scrollsSideways(target, inSheet ? sheet : null) || String((window.getSelection && getSelection()) || '').length) return;
  if (!inSheet && !parentOf(S.route)) return;   // the home screen: nowhere to go up to
  if (!inSheet && !standalone && t.clientX < 24) return;   // in a browser tab its own edge swipe already goes back
  G.on = Object.assign(g, { kind: inSheet ? 'sheet' : 'page' });
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  const g = G.on;
  if (!g || e.touches.length !== 1) return;
  const t = e.touches[0];
  g.dx = t.clientX - g.x0; g.dy = t.clientY - g.y0;
  if (!g.dir) {
    if (Math.abs(g.dx) < 10 && Math.abs(g.dy) < 10) return;
    g.dir = g.kind === 'down' ? (g.dy > 0 && g.dy > Math.abs(g.dx) ? 'y' : 'no') : (g.dx > 0 && g.dx > Math.abs(g.dy) * 1.5 ? 'x' : 'no');
    if (g.dir === 'no') { G.on = null; return; }
    dragEl(g).style.willChange = 'transform';
  }
  if (e.cancelable) e.preventDefault();   // nothing scrolls while you drag
  dragTo(g, Math.max(0, g.dir === 'y' ? g.dy : g.dx));
}, { passive: false });
document.addEventListener('touchend', (e) => { const g = G.on; G.on = null; if (g && g.dir) dragEnd(g, e.timeStamp); }, { passive: true });
document.addEventListener('touchcancel', () => { const g = G.on; G.on = null; if (g && g.dir) dragReset(g); }, { passive: true });

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
    return ok;
  } catch (e) { return false; }
}

/**
 * Reads the show's own website (Apps Script does, where its robots.txt allows) and fills in what it says: the dates, the
 * venue, the name if empty, and the link to its exhibitor list. Never overwrites what you typed. Says what it found, or why not.
 */
let lookSeq = 0;
async function lookUp(url) {
  const f = $('#showForm'), box = $('#sf-look');
  if (!f || f.dataset.id || !box) return;
  const seq = ++lookSeq;
  const still = () => seq === lookSeq && document.body.contains(box);
  box.hidden = false; box.className = 'look';
  if (C.isDirectory(url)) {
    const host = (/^https?:\/\/(?:www\.)?([^\/?#]+)/i.exec(C.validUrl(url)) || [])[1] || 'that site';
    box.className = 'look warn';
    box.innerHTML = `That’s a page on ${esc(host)}, which the app does not read. From it, open the show’s own website and share that.<br><button class="link-btn" type="button" data-act="save-listing" data-url="${esc(url)}">Keep it as a search page</button>`;
    return;
  }
  box.innerHTML = '<span class="spinner" aria-hidden="true"></span>Looking at the show’s website…';
  let j;
  try { j = await call('lookShow', { url }); } catch (e) {
    if (!still()) return;
    if (/unknown action/i.test(e.message)) { box.hidden = true; return; }   // an Apps Script from before release 17
    box.className = 'look warn'; box.textContent = 'Could not read the website: ' + e.message; return;
  }
  if (!still()) return;
  const set = (id, val, mark) => { const el = $(id); if (el && val && !el.value.trim()) { el.value = val; if (mark) $(mark).hidden = false; return true; } return false; };
  if (j.directory) {
    box.className = 'look warn';
    box.innerHTML = `That’s a listings page on ${esc(j.host)}, which the app does not read. From it, open the show’s own website and share that.<br><button class="link-btn" type="button" data-act="save-listing" data-url="${esc(url)}">Keep it as a search page</button>`;
    return;
  }
  if (j.blocked || j.error) { box.className = 'look warn'; box.textContent = (j.note || j.error) + '. Add the exhibitor list link yourself, or choose List and paste it.'; return; }
  set('#sf-name', j.name);
  // a diary show not dated yet: the website may still be showing this year's edition, whose dates and list are not this one's
  const year = f.dataset.year;
  if (year && j.start && !C.fitsYear(j.start, year)) {
    box.className = 'look';
    box.innerHTML = `Its website still shows ${esc(C.fmtDates(j.start, j.end))}.<small>Those are not the ${esc(year)} dates, so they are left empty, and so is its current exhibitor list. Add the show now and fill them in when they are out.</small>`;
    return;
  }
  if (set('#sf-start', j.start, '#sf-dates-from')) set('#sf-end', j.end);
  set('#sf-venue', j.venue, '#sf-venue-from');
  const box2 = $('#sf-urls');
  if (j.listUrl && !j.self && box2 && C.validUrl(box2.value.trim()) === C.validUrl(url)) box2.value = j.listUrl;
  if (j.listUrl && j.count) {
    box.className = 'look ok';
    box.innerHTML = j.self ? `<b>✓ This is the exhibitor list</b><small>About ${esc(j.count)} names on it</small>`
      : `<b>✓ Found the exhibitor list</b> on the show’s website<small>${j.listText ? `“${esc(j.listText)}” · ` : ''}about ${esc(j.count)} names</small>`;
  } else if (j.listUrl) {
    box.className = 'look warn';
    box.innerHTML = `Found its exhibitor page${j.listText ? ` (“${esc(j.listText)}”)` : ''}, but no names could be read from it yet.<small>Try Add and load anyway, or choose List and paste the names.</small>`;
  } else {
    box.className = 'look';
    box.innerHTML = 'No exhibitor list on its website yet.<small>Add the show now and load the list when it appears, often a few weeks before. Or paste it.</small>';
  }
}

/** What the last message did, in words. A check that finishes in the background has no screen to say so, so Settings does. */
function lastNotifyLine(l) {
  const d = l && l.at ? new Date(l.at) : null;
  if (!d || isNaN(d)) return '';
  const time = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' }).format(d);
  const when = d.toDateString() === new Date().toDateString() ? time : new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' }).format(d) + ', ' + time;
  const what = l.kind === 'test' ? 'the test message' : 'the message for ' + (l.show || 'a check');
  return l.ok ? `Last message: ${what} was sent at ${when}.` : `Last message: ${what} could not be sent at ${when}. ${l.error || ''}`.trim();
}
function rememberNotify(ok, error) {
  if (!S.status || !S.status.notify) return;
  S.status = Object.assign({}, S.status, { notify: Object.assign({}, S.status.notify, { last: { at: new Date().toISOString(), kind: 'test', show: '', ok, error: error || '' } }) });
  put('status', S.status);
}

/* The result of the test message, written where you are looking (a pop-up alone is easy to miss). */
function showNotifyResult(msg, bad) {
  document.querySelectorAll('.notify-result').forEach((el) => { el.textContent = msg; el.classList.toggle('bad', !!bad); if (msg && el.offsetParent) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* older browser */ } } });
}

async function connect(url, token) {
  const u = C.validApiUrl(url);
  if (!u) { toast('That does not look like a web app address. It ends in /exec.'); return false; }
  if (!token.trim()) { toast('Add the access token'); return false; }
  const prev = S.api;
  S.api = { url: u, token: token.trim() };
  try {
    const st = await call('status', null, 30000);
    S.status = st; put('status', st);
    S.build = +st.build || 0; put('build', S.build);
    put('api', S.api);
    S.offline = false;
    await refreshShows();
    toast('Connected to your sheet');
    return true;
  } catch (e) {
    S.api = prev;
    toast(e.net ? 'Could not reach that address. Check it and your connection.' : e.message);
    return false;
  }
}

/* ---------- Files ---------- */
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const byId = () => Object.fromEntries(S.shows.map((s) => [s.id, s]));

function downloadShow(s, onlyShown) {
  const rows = S.rows[s.id] || [];
  if (!rows.length) { toast('Nothing to download yet'); return; }
  const list = C.filterRows(rows, onlyShown ? { filter: S.filter, q: S.q } : {});
  download(`exhibitor-leads-${C.slug(s.name)}-${today()}.csv`, C.toCsv(list, byId()));
  toast(`Saved ${C.plural(list.length, 'exhibitor')} to a CSV file`);
}

async function downloadSector(sector) {
  const shows = S.shows.filter((s) => s.sector === sector);
  let rows;
  try { rows = (await call('rows', { sector })).rows; setOffline(null); }
  catch (e) {
    rows = [];
    shows.forEach((s) => { rows = rows.concat(S.rows[s.id] || cachedRows(s.id)); });
    if (!rows.length) { toast(e.message); return; }
    toast('Could not reach your sheet, so this uses what is saved on this phone');
  }
  const merged = C.mergeBySite(C.filterRows(rows, {}), byId());
  download(`exhibitor-leads-${C.slug(sector)}-sector-${today()}.csv`, C.toCsv(merged, byId()));
  toast(`Saved ${C.plural(merged.length, 'business', 'businesses')} to a CSV file`);
}

/* ---------- Actions ---------- */
/** While Apps Script works: the button shows a spinner and cannot be pressed twice. */
async function withBusy(btn, fn) {
  if (btn) { btn.disabled = true; btn.classList.add('busy'); btn.setAttribute('aria-busy', 'true'); }
  try { return await fn(); } finally { if (btn) { btn.disabled = false; btn.classList.remove('busy'); btn.removeAttribute('aria-busy'); } }
}

/**
 * A menu action that asks Apps Script to do something: the menu closes at once and a message with a spinner says what is
 * happening, the answer replaces it, and the lists refresh afterwards without holding anything up.
 */
async function runFromMenu(working, fn) {
  closeSheet();
  busyToast(working);
  try { await fn(); } catch (e) { toast(oldScript(e)); }
}

async function loadList(s, btn) {
  await withBusy(btn, async () => {
    busyToast('Reading the exhibitor list…');
    try {
      const r = await call('loadShow', { id: s.id }, 90000);
      await refreshShows();
      if (r.status === 'loaded') {
        toast(`${C.plural(r.added, 'exhibitor')} added${r.skipped ? `, ${r.skipped} already there` : ''}`);
        await fetchRows(s.id).catch(() => {});
      } else toast(r.note || 'No exhibitors found');
      E.userPaused = false;
      updateShow();
      ensureChecking();
    } catch (e) { setOffline(e); toast(e.message); }
  });
}

async function submitShow(form) {
  const f = new FormData(form), id = form.dataset.id;
  const name = String(f.get('name') || '').trim(), sector = C.matchSector(f.get('sector'), S.shows);
  if (!name) { toast('Give the exhibition a name'); return; }
  if (!sector) { toast('Add a sector, such as Whisky and spirits'); return; }
  const listMode = !id && form.dataset.mode === 'list';
  let urls = [], list = '';
  if (listMode) {
    list = String(f.get('list') || '').trim();
    if (!list) { toast('Paste at least one exhibitor, or choose Link'); return; }
  } else {
    const k = C.linkBoxKind(f.get('urls'));
    if (k.kind === 'list') {
      if (!id && linkBoxToList()) return;   // shown in the list box: one more tap adds it
      toast('That looks like a list of exhibitors. Add it with Paste a list in the exhibition menu'); return;
    }
    if (k.kind === 'bad') { toast(`“${k.bad.length > 40 ? k.bad.slice(0, 40) + '…' : k.bad}” is not a web address. Check it${id ? '' : ', or choose List to paste the exhibitors'}`); return; }
    urls = k.urls;
  }
  const btn = form.querySelector('[type=submit]');
  await withBusy(btn, async () => {
    try {
      const j = await call('saveShow', { id: id || undefined, name, sector, start: f.get('start') || '', end: f.get('end') || '', urls: urls.join('\n'), venue: String(f.get('venue') || '').trim() });
      S.set.lastSector = sector; saveSet();
      // the list goes in with the exhibition, so its checks start at once
      let pasted = null, pasteErr = null;
      if (list) { try { pasted = await call('pasteList', { showId: j.show.id, text: list }); } catch (err) { pasteErr = err; } }
      closeSheet();
      await refreshShows();
      const show = showById(j.show.id) || j.show;
      if (!id) {
        E.userPaused = false;
        go({ v: 'show', showId: show.id, sector: show.sector }, S.route.v === 'diary');   // from the diary: the show takes its place, so up is one step back
        if (pasted) toast(`${C.plural(pasted.added, 'exhibitor')} added${pasted.skipped ? `, ${pasted.skipped} already there` : ''}`);
        else if (pasteErr) toast(`The exhibition was added, but not the list: ${pasteErr.message}. Tap Paste the list to try again`);
        else if (show.urls.length) { await sleep(50); loadList(show, null); } else toast('Added. Paste the list to get started');
      } else { toast('Saved'); if (S.route.v === 'show') { const h = $('#showHero'); if (h) h.dataset.key = ''; updateShow(); } else renderMain(); }
    } catch (e) { setOffline(e); toast(e.message); }
  });
}
